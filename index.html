<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IGIS RA Portal</title>
    <link rel="stylesheet" href="./shared/ifpdp-system-theme.css?v=ifpdp_system_3">
    <link rel="stylesheet" href="./org_dashboard/admin.css">
    <script src="./CRM_base/portfolio-analysis/config.js"></script>
    <script src="./shared/ra-auth.js?v=ra_auth_1"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            background: #1f1f1e;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            box-sizing: border-box;
        }
        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 40px;
            background: #262626;
            border: 1px solid #3c3c3c;
            border-radius: 24px;
            box-shadow: 0 18px 48px rgba(0,0,0,0.22);
        }
        .login-logo { font-size: 44px; margin-bottom: 20px; text-align: center; }
        h1 { margin: 0 0 8px; font-size: 32px; font-weight: 800; text-align: center; }
        p.subtitle { color: #8e8e93; margin: 0 0 28px; font-size: 15px; text-align: center; }
        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 24px;
            padding: 6px;
            background: #1f1f1e;
            border: 1px solid #3c3c3c;
            border-radius: 14px;
        }
        .auth-tab {
            border: 0;
            border-radius: 10px;
            padding: 12px 10px;
            background: transparent;
            color: #8e8e93;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }
        .auth-tab.active { background: #3c3c3c; color: #fff; }
        .auth-panel { display: none; }
        .auth-panel.active { display: block; }
        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #8e8e93;
            font-size: 13px;
        }
        .input-group input {
            width: 100%;
            padding: 15px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.08);
            box-shadow: none;
        }
        .check-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 2px 0 18px;
            color: #c7c7cc;
            font-size: 14px;
            font-weight: 700;
        }
        .check-row input { width: 18px; height: 18px; accent-color: var(--accent); }
        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }
        .login-btn:hover { background: var(--accent-light); box-shadow: none; }
        .login-btn:disabled { opacity: 0.6; cursor: wait; }
        .helper-text {
            margin: 12px 0 0;
            color: #8e8e93;
            font-size: 13px;
            line-height: 1.55;
        }
        .message { margin-top: 20px; font-size: 14px; min-height: 20px; font-weight: 700; text-align: center; }
        .error { color: #ff453a; }
        .success { color: #32d74b; }
        @media (max-width: 520px) {
            body { padding: 14px; align-items: flex-start; }
            .login-card { padding: 28px 20px; border-radius: 20px; margin-top: 28px; }
            h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="login-logo">IGIS</div>
        <h1>RA Portal</h1>
        <p class="subtitle">회사 이메일과 개인 비밀번호로 접속합니다.</p>

        <div class="auth-tabs" role="tablist" aria-label="로그인 방식">
            <button class="auth-tab active" id="loginTab" type="button" data-panel="loginPanel">로그인</button>
            <button class="auth-tab" id="setupTab" type="button" data-panel="setupPanel">처음 설정</button>
        </div>

        <form id="loginPanel" class="auth-panel active">
            <div class="input-group">
                <label for="loginEmail">회사 이메일</label>
                <input type="email" id="loginEmail" autocomplete="username" placeholder="example@igisam.com" required>
            </div>
            <div class="input-group">
                <label for="loginPassword">비밀번호</label>
                <input type="password" id="loginPassword" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
            </div>
            <label class="check-row">
                <input type="checkbox" id="rememberLogin">
                <span>자동로그인 유지</span>
            </label>
            <button type="submit" class="login-btn" id="loginBtn">로그인</button>
            <p class="helper-text">자동로그인은 30일이 지나거나 3일 이상 접속 기록이 없으면 해제됩니다.</p>
        </form>

        <form id="setupPanel" class="auth-panel">
            <div class="input-group">
                <label for="setupEmail">회사 이메일</label>
                <input type="email" id="setupEmail" autocomplete="username" placeholder="example@igisam.com" required>
            </div>
            <div class="input-group">
                <label for="setupCode">설정 코드</label>
                <input type="password" id="setupCode" autocomplete="one-time-code" placeholder="처음 설정 코드를 입력하세요" required>
            </div>
            <div class="input-group">
                <label for="setupPassword">새 비밀번호</label>
                <input type="password" id="setupPassword" autocomplete="new-password" placeholder="8자 이상" minlength="8" required>
            </div>
            <div class="input-group">
                <label for="setupPasswordConfirm">새 비밀번호 확인</label>
                <input type="password" id="setupPasswordConfirm" autocomplete="new-password" placeholder="한 번 더 입력하세요" minlength="8" required>
            </div>
            <label class="check-row">
                <input type="checkbox" id="rememberAfterSetup">
                <span>설정 후 자동로그인</span>
            </label>
            <button type="submit" class="login-btn" id="setupBtn">비밀번호 설정</button>
            <p class="helper-text">설정 코드는 최초 비밀번호 설정과 재설정에만 사용합니다.</p>
        </form>

        <div id="messageArea" class="message" aria-live="polite"></div>
    </main>

    <script>
        const FRAME_VERSION = "mobile_patch_78b9400";
        const redirectTarget = new URLSearchParams(window.location.search).get("redirect");
        const messageArea = document.getElementById("messageArea");

        document.querySelectorAll(".auth-tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".auth-tab").forEach(button => button.classList.remove("active"));
                document.querySelectorAll(".auth-panel").forEach(panel => panel.classList.remove("active"));
                tab.classList.add("active");
                document.getElementById(tab.dataset.panel).classList.add("active");
                setMessage("");
            });
        });

        boot();

        async function boot() {
            const current = RAAuth.getSessionUser();
            if (current) {
                goNext();
                return;
            }
            const resumed = await RAAuth.resumeRememberedSession();
            if (resumed) goNext();
        }

        document.getElementById("loginPanel").addEventListener("submit", async event => {
            event.preventDefault();
            const button = document.getElementById("loginBtn");
            const payload = {
                email: document.getElementById("loginEmail").value,
                password: document.getElementById("loginPassword").value,
                remember: document.getElementById("rememberLogin").checked,
            };
            await runAuth(button, "로그인 중...", async () => {
                const data = await RAAuth.request("login", payload);
                completeLogin(data);
            });
        });

        document.getElementById("setupPanel").addEventListener("submit", async event => {
            event.preventDefault();
            const password = document.getElementById("setupPassword").value;
            const confirm = document.getElementById("setupPasswordConfirm").value;
            if (password !== confirm) {
                setMessage("비밀번호 확인이 일치하지 않습니다.", "error");
                return;
            }
            const button = document.getElementById("setupBtn");
            const payload = {
                email: document.getElementById("setupEmail").value,
                setup_code: document.getElementById("setupCode").value,
                password,
                remember: document.getElementById("rememberAfterSetup").checked,
            };
            await runAuth(button, "설정 중...", async () => {
                await RAAuth.request("setup-check", {
                    email: payload.email,
                    setup_code: payload.setup_code,
                });
                const data = await RAAuth.request("set-password", payload);
                completeLogin(data);
            });
        });

        async function runAuth(button, loadingText, task) {
            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = loadingText;
            setMessage("");
            try {
                await task();
            } catch (error) {
                setMessage(error.message || "인증 처리 중 오류가 발생했습니다.", "error");
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        function completeLogin(data) {
            RAAuth.setSessionUser(data.user);
            if (data.session_token) RAAuth.saveRememberToken(data.session_token);
            setMessage(`${data.user.name}님 환영합니다. 이동합니다...`, "success");
            window.setTimeout(goNext, 500);
        }

        function goNext() {
            if (redirectTarget) {
                location.href = redirectTarget;
            } else {
                location.href = `./portal.html?v=${FRAME_VERSION}`;
            }
        }

        function setMessage(text, type = "") {
            messageArea.innerHTML = text ? `<span class="${type}">${text}</span>` : "";
        }
    </script>
</body>
</html>
