<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IGIS RA Portal</title>
    <link rel="stylesheet" href="./shared/ifpdp-system-theme.css?v=ifpdp_system_3">
    <link rel="stylesheet" href="./05. Org Board/admin.css">
    <script src="./01. RA Portal/portfolio-analysis/config.js"></script>
    <script src="./shared/ra-auth.js?v=ra_auth_1"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 22px;
            background: radial-gradient(circle at 52% 18%, rgba(37,99,235,0.18), transparent 34%), #111820;
            color: #f8fafc;
            font-family: Inter, Arial, "Noto Sans KR", sans-serif;
        }
        .login-card {
            width: min(430px, 100%);
            padding: 24px;
            background: rgba(15,23,42,0.94);
            border: 1px solid rgba(148,163,184,0.26);
            border-radius: 12px;
            box-shadow: 0 24px 72px rgba(0,0,0,0.34);
        }
        .login-logo {
            margin: 0;
            color: #fff;
            font-size: 28px;
            font-weight: 950;
            letter-spacing: 0;
            line-height: 1.1;
        }
        h1 {
            margin: 12px 0 4px;
            color: #fff;
            font-size: 22px;
            font-weight: 950;
            line-height: 1.25;
        }
        p.subtitle {
            margin: 0 0 18px;
            color: #a9b7c9;
            font-size: 13px;
            line-height: 1.5;
        }
        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 16px;
            padding: 5px;
            background: rgba(30,41,59,0.9);
            border: 0;
            border-radius: 10px;
        }
        .auth-tab {
            height: 34px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #9fb1c7;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
        }
        .auth-tab.active { background: #2563eb; color: #fff; }
        .auth-panel { display: none; gap: 12px; }
        .auth-panel.active { display: grid; }
        .input-group {
            display: grid;
            gap: 6px;
            margin: 0;
            text-align: left;
        }
        .input-group label {
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 900;
        }
        .input-group input {
            width: 100%;
            height: 42px;
            padding: 0 11px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(148,163,184,0.26);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-group input::placeholder { color: #7b8798; }
        .input-group input:focus {
            border-color: rgba(96,165,250,0.8);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
        }
        .check-row {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 800;
        }
        .check-row input { width: 16px; height: 16px; accent-color: #2563eb; }
        .login-btn {
            width: 100%;
            height: 42px;
            padding: 0 14px;
            background: #2563eb;
            color: #fff;
            border: 0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 950;
            cursor: pointer;
        }
        .login-btn:hover { background: #1d4ed8; }
        .login-btn:disabled { opacity: 0.64; cursor: wait; }
        .helper-text {
            margin: 0;
            color: #9fb1c7;
            font-size: 11px;
            line-height: 1.5;
        }
        .message {
            min-height: 18px;
            margin-top: 14px;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 900;
        }
        .error { color: #fca5a5; }
        .success { color: #86efac; }
        @media (max-width: 520px) {
            body {
                place-items: start center;
                padding: 14px;
            }
            .login-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="login-logo">IGIS</div>
        <h1>RA Portal</h1>
        <p class="subtitle">회사 이메일과 개인 비밀번호로 접속합니다.</p>

        <div class="auth-tabs" role="tablist" aria-label="로그인 방식">
            <button class="auth-tab active" id="loginTab" type="button" data-panel="loginPanel">로그인</button>
            <button class="auth-tab" id="setupTab" type="button" data-panel="setupPanel">처음 설정</button>
        </div>

        <form id="loginPanel" class="auth-panel active">
            <div class="input-group">
                <label for="loginEmail">회사 이메일</label>
                <input type="email" id="loginEmail" autocomplete="username" placeholder="name@igisam.com" required>
            </div>
            <div class="input-group">
                <label for="loginPassword">비밀번호</label>
                <input type="password" id="loginPassword" autocomplete="current-password" placeholder="비밀번호" required>
            </div>
            <label class="check-row">
                <input type="checkbox" id="rememberLogin">
                <span>자동로그인 유지</span>
            </label>
            <button type="submit" class="login-btn" id="loginBtn">로그인</button>
            <p class="helper-text">자동로그인은 30일이 지나거나 3일 이상 접속 기록이 없으면 해제됩니다.</p>
        </form>

        <form id="setupPanel" class="auth-panel">
            <div class="input-group">
                <label for="setupEmail">회사 이메일</label>
                <input type="email" id="setupEmail" autocomplete="username" placeholder="name@igisam.com" required>
            </div>
            <div class="input-group">
                <label for="setupCode">설정 코드</label>
                <input type="password" id="setupCode" autocomplete="one-time-code" placeholder="설정 코드 입력" required>
            </div>
            <div class="input-group">
                <label for="setupPassword">새 비밀번호</label>
                <input type="password" id="setupPassword" autocomplete="new-password" placeholder="8자 이상" minlength="8" required>
            </div>
            <div class="input-group">
                <label for="setupPasswordConfirm">새 비밀번호 확인</label>
                <input type="password" id="setupPasswordConfirm" autocomplete="new-password" placeholder="한 번 더 입력" minlength="8" required>
            </div>
            <label class="check-row">
                <input type="checkbox" id="rememberAfterSetup">
                <span>설정 후 자동로그인</span>
            </label>
            <button type="submit" class="login-btn" id="setupBtn">비밀번호 설정</button>
            <p class="helper-text">설정 코드는 최초 비밀번호 설정과 재설정에만 사용합니다.</p>
        </form>

        <div id="messageArea" class="message" aria-live="polite"></div>
    </main>

    <script>
        const FRAME_VERSION = "mobile_patch_78b9400";
        const redirectTarget = new URLSearchParams(window.location.search).get("redirect");
        const messageArea = document.getElementById("messageArea");

        document.querySelectorAll(".auth-tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".auth-tab").forEach(button => button.classList.remove("active"));
                document.querySelectorAll(".auth-panel").forEach(panel => panel.classList.remove("active"));
                tab.classList.add("active");
                document.getElementById(tab.dataset.panel).classList.add("active");
                setMessage("");
            });
        });

        boot();

        async function boot() {
            const current = RAAuth.getSessionUser();
            if (current) {
                goNext();
                return;
            }
            const resumed = await RAAuth.resumeRememberedSession();
            if (resumed) goNext();
        }

        document.getElementById("loginPanel").addEventListener("submit", async event => {
            event.preventDefault();
            const button = document.getElementById("loginBtn");
            const payload = {
                email: document.getElementById("loginEmail").value,
                password: document.getElementById("loginPassword").value,
                remember: document.getElementById("rememberLogin").checked,
            };
            await runAuth(button, "로그인 중...", async () => {
                const data = await RAAuth.request("login", payload);
                completeLogin(data);
            });
        });

        document.getElementById("setupPanel").addEventListener("submit", async event => {
            event.preventDefault();
            const password = document.getElementById("setupPassword").value;
            const confirm = document.getElementById("setupPasswordConfirm").value;
            if (password !== confirm) {
                setMessage("비밀번호 확인이 일치하지 않습니다.", "error");
                return;
            }
            const button = document.getElementById("setupBtn");
            const payload = {
                email: document.getElementById("setupEmail").value,
                setup_code: document.getElementById("setupCode").value,
                password,
                remember: document.getElementById("rememberAfterSetup").checked,
            };
            await runAuth(button, "설정 중...", async () => {
                await RAAuth.request("setup-check", {
                    email: payload.email,
                    setup_code: payload.setup_code,
                });
                const data = await RAAuth.request("set-password", payload);
                completeLogin(data);
            });
        });

        async function runAuth(button, loadingText, task) {
            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = loadingText;
            setMessage("");
            try {
                await task();
            } catch (error) {
                setMessage(error.message || "인증 처리 중 오류가 발생했습니다.", "error");
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        function completeLogin(data) {
            RAAuth.setSessionUser(data.user);
            if (data.session_token) RAAuth.saveRememberToken(data.session_token);
            setMessage(`${data.user.name}님 환영합니다. 이동합니다...`, "success");
            window.setTimeout(goNext, 500);
        }

        function goNext() {
            if (redirectTarget) {
                location.href = redirectTarget;
            } else {
                location.href = `./portal.html?v=${FRAME_VERSION}`;
            }
        }

        function setMessage(text, type = "") {
            messageArea.innerHTML = text ? `<span class="${type}">${text}</span>` : "";
        }
    </script>
</body>
</html>
