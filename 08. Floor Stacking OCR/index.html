<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>층별현황판 OCR</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div>
          <p class="eyebrow">Building Directory OCR</p>
          <h1>층별현황판 OCR</h1>
        </div>
      </header>

      <section class="setup-card" aria-label="촬영 전 입력">
        <label class="building-field top-building-field" for="buildingNameInput">
          <span>건물명</span>
          <input id="buildingNameInput" type="text" placeholder="예: 강남N타워" autocomplete="organization">
        </label>
        <div class="top-actions">
          <label class="button primary" for="cameraInput">
            사진 촬영
          </label>
          <input id="cameraInput" type="file" accept="image/*" capture="environment">
          <label class="button" for="imageInput">
            사진 불러오기
          </label>
          <input id="imageInput" type="file" accept="image/*">
        </div>
      </section>

      <section class="workbench" aria-label="층별현황판 OCR 작업 영역">
        <section class="capture-panel" aria-labelledby="captureTitle">
          <div class="panel-head">
            <div>
              <h2 id="captureTitle">사진</h2>
              <p id="fileMeta">촬영하거나 저장된 이미지를 선택하십시오.</p>
            </div>
            <label class="switch">
              <input id="enhanceToggle" type="checkbox">
              <span>고대비 보정</span>
            </label>
          </div>

          <div id="dropZone" class="drop-zone">
            <canvas id="previewCanvas" width="1200" height="840" aria-label="선택한 층별현황판 사진 미리보기"></canvas>
            <div id="emptyState" class="empty-state">
              <strong>사진 대기 중</strong>
              <span>층수와 회사명이 보이도록 정면에서 촬영하십시오.</span>
            </div>
          </div>

          <div class="scan-actions">
            <button id="runOcrButton" class="button primary" type="button" disabled>OCR 실행</button>
            <button id="clearButton" class="button" type="button">초기화</button>
          </div>

          <div class="status-box" aria-live="polite">
            <div class="status-row">
              <span id="statusText">대기 중</span>
              <span id="statusPercent">0%</span>
            </div>
            <div class="progress-track">
              <div id="progressBar" class="progress-bar"></div>
            </div>
          </div>
        </section>

        <section class="result-panel" aria-labelledby="resultTitle">
          <div class="panel-head">
            <div>
              <h2 id="resultTitle">변환 결과</h2>
              <p>층별 회사와 시설만 확인한 뒤 시트에 저장합니다.</p>
            </div>
          </div>

          <textarea id="rawText" hidden></textarea>

          <div class="summary-row">
            <span id="rowCount">0개 항목</span>
          </div>

          <div class="sheet-box">
            <button id="saveSheetButton" class="button primary" type="button" disabled>구글시트 저장</button>
            <p id="sheetStatus" class="sheet-status">건물명과 표 항목이 있으면 저장할 수 있습니다.</p>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">층</th>
                  <th scope="col">회사 / 시설</th>
                </tr>
              </thead>
              <tbody id="resultBody">
                <tr class="placeholder-row">
                  <td colspan="2">변환된 항목이 없습니다.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
