<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Management System | IGIS RA</title>
    <link rel="stylesheet" href="./shared/ifpdp-system-theme.css?v=ifpdp_system_3">
    <link rel="stylesheet" href="./org_dashboard/admin.css">
    <script src="./CRM_base/portfolio-analysis/config.js"></script>
    <script src="./shared/ra-auth.js?v=ra_auth_1"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1f1f1e; font-family: var(--font); }
        
        .global-nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 64px;
            background: #1f1f1e; border-bottom: 1px solid #3c3c3c;
            z-index: 1000; display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; color: #fff; box-sizing: border-box;
        }
        .nav-left { display: flex; align-items: center; gap: 24px; }
        .nav-brand { font-size: 18px; font-weight: 800; color: #fff; margin-right: 20px; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 8px; }
        .nav-link-btn {
            padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600;
            color: var(--text-muted); text-decoration: none; transition: all 0.2s;
            border: 1px solid transparent; cursor: pointer; background: transparent;
        }
        .nav-link-btn:hover { background: #333; color: #fff; }
        .nav-link-btn.active { color: #fff; background: #3c3c3c; border-color: #3c3c3c; }
        
        .nav-right { display: flex; align-items: center; gap: 20px; font-size: 14px; }
        .user-info { color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        .user-name { color: #fff; font-weight: 700; }
        .logout-btn {
            padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700;
            background: rgba(255,69,58,0.1); color: #ff453a; border: 1px solid rgba(255,69,58,0.2); cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover { background: #ff453a; color: #fff; }

        .content-wrapper {
            position: absolute; top: 64px; left: 0; width: 100%; height: calc(100% - 64px);
            background: #1f1f1e;
        }
        .dashboard-frame {
            width: 100%; height: 100%; border: none;
            background: #1f1f1e; position: absolute; top: 0; left: 0;
            display: none; /* Default hidden */
        }
        .dashboard-frame.active { display: block; }

        @media (max-width: 760px) {
            .global-nav {
                height: 52px;
                padding: 0 14px;
            }
            .nav-brand {
                margin-right: 0;
                font-size: 14px;
            }
            .nav-links {
                display: none;
            }
            .nav-right {
                gap: 8px;
                font-size: 12px;
            }
            .user-info {
                display: none;
            }
            .logout-btn {
                padding: 7px 10px;
            }
            .content-wrapper {
                top: 52px;
                height: calc(100% - 52px - 78px - env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
</head>
<body class="has-mobile-tabs">
    <nav class="global-nav">
        <div class="nav-left">
            <a href="#" class="nav-brand">🛰️ IGIS RA Portal</a>
            <div class="nav-links">
                <div id="tab-insight" class="nav-link-btn active" onclick="switchTab('insight')">RA Insight</div>
                <div id="tab-t5t" class="nav-link-btn" onclick="switchTab('t5t')">T5T 업무</div>
                <div id="tab-org" class="nav-link-btn" onclick="switchTab('org')">조직구성</div>
                <div id="tab-admin" class="nav-link-btn" style="display:none;" onclick="switchTab('admin')">어드민 (Local)</div>
            </div>
        </div>
        <div class="nav-right">
            <div class="user-info">
                <span id="userNameDisplay" class="user-name">-</span>님 환영합니다
            </div>
            <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        </div>
    </nav>

    <div class="content-wrapper">
        <iframe id="iframe-insight" class="dashboard-frame active" src="about:blank"></iframe>
        <iframe id="iframe-t5t" class="dashboard-frame" src="about:blank"></iframe>
        <iframe id="iframe-input" class="dashboard-frame" src="about:blank"></iframe>
        <iframe id="iframe-org" class="dashboard-frame" src="about:blank"></iframe>
        <iframe id="iframe-admin" class="dashboard-frame" src="about:blank"></iframe>
    </div>

    <nav class="mobile-dashboard-tabs" aria-label="Mobile dashboard navigation">
        <button id="mobile-tab-insight" class="mobile-dashboard-tab is-active" type="button" onclick="switchTab('insight')">펀드검색</button>
        <button id="mobile-tab-t5t" class="mobile-dashboard-tab" type="button" onclick="switchTab('t5t')">T5T</button>
        <button id="mobile-tab-input" class="mobile-dashboard-tab" type="button" onclick="switchTab('input')">T5T작성</button>
        <button id="mobile-tab-org" class="mobile-dashboard-tab" type="button" onclick="switchTab('org')">조직</button>
    </nav>

    <script>
        const urls = {
            insight: './CRM_base/portfolio-analysis/index.html',
            t5t: './t5t-dashboard/index.html',
            input: './t5t-input/index.html',
            org: './org_dashboard/index.html',
            admin: './org_dashboard/admin.html'
        };
        const FRAME_VERSION = 'mobile_patch_78b9400';
        const loaded = new Set();

        function markEmbeddedFrame(frame) {
            try {
                const doc = frame.contentWindow.document;
                doc.documentElement.classList.add('embedded-frame');
                if (doc.body) doc.body.classList.add('embedded-frame');
            } catch (e) {
                console.warn("Iframe embedded mode marking limited.");
            }
        }

        function bindFrameActivity(frame) {
            markEmbeddedFrame(frame);
            try {
                const doc = frame.contentWindow.document;
                ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(name => {
                    doc.addEventListener(name, resetTimer, true);
                });
            } catch (e) { console.warn("Iframe activity tracking limited."); }
        }

        function switchTab(id) {
            // Update UI
            document.querySelectorAll('.nav-link-btn').forEach(b => b.classList.remove('active'));
            const desktopTab = document.getElementById(`tab-${id}`);
            if (desktopTab) desktopTab.classList.add('active');
            document.querySelectorAll('.mobile-dashboard-tab').forEach(b => b.classList.remove('is-active'));
            const mobileTab = document.getElementById(`mobile-tab-${id}`);
            if (mobileTab) mobileTab.classList.add('is-active');

            // Hide all frames
            document.querySelectorAll('.dashboard-frame').forEach(f => f.classList.remove('active'));
            
            // Show target frame
            const frame = document.getElementById(`iframe-${id}`);
            frame.classList.add('active');
            markEmbeddedFrame(frame);

            // Lazy load if needed
            if (!loaded.has(id)) {
                frame.onload = () => bindFrameActivity(frame);
                frame.src = urls[id] + `?v=${FRAME_VERSION}&embedded=portal`;
                loaded.add(id);
                [150, 500, 1200, 2500].forEach(delay => window.setTimeout(() => markEmbeddedFrame(frame), delay));
            }
            resetTimer();
        }

        // Initialize first tab & check auth state
        window.addEventListener('DOMContentLoaded', initPortal);

        async function initPortal() {
            let raUser = getSession();
            if (!raUser) {
                raUser = await RAAuth.resumeRememberedSession();
            }
            if (!raUser) {
                location.href = './index.html';
                return;
            }

            document.getElementById('userNameDisplay').innerText = raUser.name;
            // '이시정' 사용자에게만 어드민 탭 노출
            if (raUser.name === '이시정') {
                document.getElementById('tab-admin').style.display = 'block';
            }
            resetTimer();
            switchTab('insight');
        }

        // Session activity marker for child frames. Auto-login expiry is handled server-side.
        function getSession() { return RAAuth.getSessionUser(); }
        function resetTimer() { RAAuth.touch(); }

        ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(name => {
            document.addEventListener(name, resetTimer, true);
        });

        async function handleLogout() {
            await RAAuth.logout();
            location.href = './index.html';
        }
    </script>
</body>
</html>
