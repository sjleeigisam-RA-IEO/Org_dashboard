<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#102b48">
  <title>로그인 · One Account</title>
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login-layout">
    <section class="brand-panel" aria-labelledby="brand-title">
      <a class="wordmark" href="/" aria-label="One Account 로그인 홈"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span><span>IGIS<span class="wordmark-sub">ASSET MANAGEMENT</span></span></a>
      <div class="brand-copy">
        <p class="eyebrow">RELATIONSHIP INTELLIGENCE</p>
        <h1 id="brand-title">ONE<span class="mobile-space"> </span><br>ACCOUNT<span class="brand-dot">.</span></h1>
        <div class="brand-rule" aria-hidden="true"></div>
        <p class="brand-description">하나의 연결에서,<br>더 넓은 기회로.</p>
        <p class="brand-detail">고객과의 관계를 한눈에 살펴보세요.</p>
      </div>
      <p class="brand-footer">ONE ACCOUNT DASHBOARD</p>
      <div class="orbital orbital-one" aria-hidden="true"></div>
      <div class="orbital orbital-two" aria-hidden="true"></div>
    </section>
    <section class="form-panel" aria-labelledby="login-title">
      <div class="login-card">
        <span class="access-label"><span aria-hidden="true"></span> INTERNAL ACCESS</span>
        <h2 id="login-title">로그인</h2>
        <p class="form-intro">회사메일과 안내받은 배포코드를 입력해 주세요.</p>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">회사메일</label>
            <div class="email-actions">
              <input id="email" name="email" type="email" placeholder="name@igisam.com" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" required aria-describedby="email-hint">
              <button id="send-code-button" class="send-code-button" type="button" hidden>배포코드 받기</button>
            </div>
            <p class="field-hint" id="email-hint">@igisam.com 회사메일로 접속할 수 있습니다.</p>
            <p class="send-code-status" id="send-code-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
          </div>
          <div class="field code-field">
            <label for="code">배포코드</label>
            <div class="password-wrap">
              <input id="code" name="code" type="password" placeholder="배포코드를 입력하세요" autocomplete="current-password" maxlength="256" required>
              <button id="toggle-code" class="reveal-button" type="button" aria-label="배포코드 표시" aria-pressed="false">표시</button>
            </div>
          </div>
          <div class="remember-field">
            <label class="remember-label" for="remember-me"><input id="remember-me" name="rememberMe" type="checkbox" aria-describedby="remember-hint"><span>자동로그인 (30일)</span></label>
            <p id="remember-hint">선택하면 이 브라우저에서 30일 동안 로그인 상태를 유지합니다.</p>
          </div>
          <p class="form-error" id="form-error" role="alert" aria-atomic="true" hidden></p>
          <button id="submit-button" class="submit-button" type="submit"><span id="submit-label">로그인</span><span class="button-arrow" aria-hidden="true">→</span><span class="spinner" aria-hidden="true" hidden></span></button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
        <p class="access-note"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4.5" y="8.5" width="11" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M7 8.5V6a3 3 0 0 1 6 0v2.5M10 12v1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>배포코드는 담당자에게 문의해 주세요.</p>
      </div>
      <p class="form-footer">IGIS ASSET MANAGEMENT</p>
    </section>
  </main>
</body>
</html>
