    function summarizeValues(values) {
      const sorted = values
        .map(value => Number(value))
        .filter(value => Number.isFinite(value))
        .sort((a, b) => a - b);
      if (!sorted.length) return { mean: 0, p75: 0, p90: 0 };
      const mean = sorted.reduce((sum, value) => sum + value, 0) / sorted.length;
      const pick = pct => {
        const idx = (sorted.length - 1) * pct;
        const lo = Math.floor(idx);
        const hi = Math.ceil(idx);
        const t = idx - lo;
        return sorted[lo] + (sorted[hi] - sorted[lo]) * t;
      };
      return { mean, p75: pick(0.75), p90: pick(0.90) };
    }

    function periodStats(period = currentPeriod) {
      if (!periodStatsCache.has(period)) {

      }
      return periodStatsCache.get(period);

    function visualDomain() {
      const domain = data.meta.valueDomain || {};
      const min = Number.isFinite(domain.p03) ? domain.p03 : domain.min;
      const p97 = Number.isFinite(domain.p97) ? domain.p97 : domain.max;
      const max = Math.max(Number.isFinite(domain.max) ? domain.max : p97, p97);
      return { min, p97, max, hasTail: max > p97 };
    }

    function normalize(value) {
      const domain = visualDomain();
      const lowerSpan = domain.p97 - domain.min || 1;
      if (!domain.hasTail || value <= domain.p97) {
        const upper = domain.hasTail ? highTailVisualStart : 1;
        return Math.max(0, Math.min(upper, ((value - domain.min) / lowerSpan) * upper));
      }
      const tailSpan = domain.max - domain.p97 || 1;
      const tailT = Math.max(0, Math.min(1, (value - domain.p97) / tailSpan));
      return highTailVisualStart + Math.pow(tailT, highTailCurve) * (1 - highTailVisualStart);
    }

    function valueForVisualNorm(norm) {
      const domain = visualDomain();
      const n = Math.max(0, Math.min(1, norm));
      if (domain.hasTail && n > highTailVisualStart) {
        const tailT = (n - highTailVisualStart) / (1 - highTailVisualStart);
        return domain.p97 + Math.pow(tailT, 1 / highTailCurve) * (domain.max - domain.p97);
      }
      const upper = domain.hasTail ? highTailVisualStart : 1;
      return domain.min + (n / (upper || 1)) * (domain.p97 - domain.min);

    }

    function columnRadiusEmphasis(point) {
      const stats = periodStats().points;
      const topDecile = Number.isFinite(stats.p90) && point.noc >= stats.p90;
      if (topDecile) return 1.28;
      if (Number.isFinite(stats.mean) && point.noc >= stats.mean) return 1.08;
      return 0.96;
    }

    function columnZoomScale() {
      if (!camera || !controls) return 1;
      const distance = camera.position.distanceTo(controls.target);
      const minScale = reviewMode ? 0.055 : columnZoomMinScale;
      const maxScale = reviewMode ? 0.24 : columnZoomMaxScale;
      return THREE.MathUtils.clamp(distance / columnZoomReference, minScale, maxScale);
    }

    function isSelectedPoint(point) {
      return Boolean(reviewMode && selectedPoint && point && point.assetId === selectedPoint.assetId);
    }

    function columnHeightForPoint(point, visualScale = columnZoomScale()) {
      const reviewHeightFactor = reviewMode ? (isSelectedPoint(point) ? 1.02 : 0.92) : 1;
      return columnBaseHeight(point.noc) * visualScale * reviewHeightFactor * columnHeightEmphasis(point);
    }

    function columnRadiusForPoint(point, visualScale = columnZoomScale()) {
      const reviewRadiusFactor = reviewMode ? (isSelectedPoint(point) ? 0.90 : 0.72) : 1;
      const radiusBase = point.tenantCount ? 7.2 : 1.85;
      return radiusBase * columnRadiusScale * Math.sqrt(visualScale) * reviewRadiusFactor * columnRadiusEmphasis(point);
    }

    function columnTopY(point) {
      return columnGroundY + columnHeightForPoint(point);
    }

    function composeColumnMatrix(matrix, point, visualScale) {
      const barHeight = columnHeightForPoint(point, visualScale);
      const radius = columnRadiusForPoint(point, visualScale);
      matrix.compose(
        new THREE.Vector3(sx(point.x), barHeight / 2 + columnGroundY, sz(point.y)),
        new THREE.Quaternion(),
        new THREE.Vector3(radius, barHeight, radius)
      );
    }

    function colorFor(value) {
      const n = normalize(value);
      const stops = [
        [0.00, [47, 128, 237]],
        [0.30, [54, 194, 180]],
        [0.55, [246, 232, 110]],
        [0.76, [255, 159, 67]],
        [0.86, [215, 38, 61]],
        [0.94, [176, 24, 76]],
        [1.00, [92, 18, 62]],
      ];
      for (let i = 0; i < stops.length - 1; i++) {
        const [a, ca] = stops[i];
        const [b, cb] = stops[i + 1];
        if (n >= a && n <= b) {
          const t = (n - a) / (b - a);
          return new THREE.Color(
            (ca[0] + (cb[0] - ca[0]) * t) / 255,
            (ca[1] + (cb[1] - ca[1]) * t) / 255,
            (ca[2] + (cb[2] - ca[2]) * t) / 255,
          );
        }
      }
      return new THREE.Color(0x5c123e);
    }

    function surfaceColorFor(value, stats) {
      const color = colorFor(value);
      if (!stats) return color;
      const n = normalize(value);
      const meanN = normalize(stats.mean);
      const aboveMean = meanN >= 0.98 ? (n >= meanN ? 1 : 0) : THREE.MathUtils.smoothstep(n, meanN, 1);
      if (aboveMean > 0) {
        color.lerp(new THREE.Color(0xfff3c4), Math.min(0.16, aboveMean * 0.12));
      }
      if (Number.isFinite(stats.p90) && value >= stats.p90) {
        color.lerp(new THREE.Color(0xff335f), 0.12);
      }
      return color;
    }

    function sx(x) { return x * horizontalScale; }
    function sz(y) { return -y * horizontalScale; }
    function xyFromLonLat(lon, lat) {
      const center = data.meta.center;
      return [
        (lon - center.lon) * 111320 * Math.cos(center.lat * Math.PI / 180),
        (lat - center.lat) * 110540,
      ];
    }

    function lonToTileX(lon, z) { return (lon + 180) / 360 * Math.pow(2, z); }
    function latToTileY(lat, z) {
      const rad = lat * Math.PI / 180;
      return (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * Math.pow(2, z);
    }
    function tileXToLon(x, z) { return x / Math.pow(2, z) * 360 - 180; }
    function tileYToLat(y, z) {
      const n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
      return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    }

    function activeMapProvider() {
      const provider = mapProviders[activeMapProviderId] || mapProviders.carto;
      if (provider.type === "vworld" && !MAP_CONFIG.vworldKey) return mapProviders.carto;
      return provider;
    }

    function baseTileProvider(provider = activeMapProvider()) {
      if (!provider.backdropProvider) return provider;
      const backdrop = mapProviders[provider.backdropProvider];
      if (backdrop && isProviderAvailable(provider.backdropProvider)) return backdrop;
      return mapProviders.carto;
    }

    function tileBlend(provider = activeMapProvider(), kind = "base") {
      const value = kind === "focus" ? provider.focusBlend : provider.baseBlend;
      return Number.isFinite(Number(value)) ? Number(value) : 1;
    }

    function isProviderAvailable(providerId) {
      const provider = mapProviders[providerId];
      if (!provider) return false;
      if (provider.type === "vworld") return Boolean(MAP_CONFIG.vworldKey);
      if (provider.type === "local" && provider.vectorSource === "sample") return Boolean(data && data.localVector && data.localVector.available);
      if (provider.type === "local" && provider.vectorSource === "seoul") return Boolean(MAP_CONFIG.seoulVectorAvailable);
      return true;
    }

    function setupMapProviderControl() {
      if (!mapProviderSelect) {
        updateMapProviderStatus();
        return;
      }
      for (const option of mapProviderSelect.options) {
        const provider = mapProviders[option.value];
        if (provider) option.disabled = !isProviderAvailable(option.value);
      }
      mapProviderSelect.value = activeMapProviderId;
      updateMapProviderStatus();
    }

    function updateMapProviderStatus() {
      const provider = activeMapProvider();
      if (attribution) attribution.textContent = provider.attribution;
      if (!mapProviderStatus) return;
      if (provider.type === "local" && provider.vectorSource === "seoul") {
        mapProviderStatus.textContent = "밝게 합성한 VWorld 지도를 배경으로 깔고, 서울 전체 도로/구/동 경계 벡터를 얹습니다. 건물 전체는 타일별 개수만 보관했습니다.";
      } else if (provider.type === "local") {
        const summary = data.localVector && data.localVector.summary;
        const building = summary && summary.center ? summary.center.building : "샘플";
        mapProviderStatus.textContent = `밝게 합성한 VWorld 지도를 배경으로 깔고, VWorld 벡터 샘플을 표시합니다. 기준: ${building} 주변.`;
      } else if (provider.type === "vworld") {
        mapProviderStatus.textContent = "VWorld는 현재 타일 응답 기준 최대 z19까지 사용합니다.";
      } else {
        mapProviderStatus.textContent = "CARTO는 근접 검토에서 z21 @2x까지 사용합니다.";
      }
    }

    async function setMapProvider(providerId) {
      if (!isProviderAvailable(providerId)) {
        updateMapProviderStatus();
        return;
      }
      if (activeMapProviderId === providerId) return;
      activeMapProviderId = providerId;
      const url = new URL(window.location.href);
      url.searchParams.set("provider", activeMapProviderId);
      window.history.replaceState(null, "", url);
      updateMapProviderStatus();
      clearFocusMap();
      removeBaseMapPlane();
      await buildBase();
      if (activeMapProvider().vectorSource === "seoul") await ensureSeoulVectorLayer();
      updateLocalVectorVisibility();
      if (selectedPoint) updateFocusMap(selectedPoint, { force: true });
    }

    function marketDataConfigured() {
      return Boolean(MAP_CONFIG.supabaseUrl && MAP_CONFIG.supabaseKey && MAP_CONFIG.marketDataSource && MAP_CONFIG.marketDataCategories);
    }

    function rowExtraInfo(row) {
      if (!row || row.extra_info == null) return {};
      if (typeof row.extra_info === "string") {
        try {
          return JSON.parse(row.extra_info);
        } catch (error) {
          return {};
        }
      }
      return row.extra_info;
    }

    async function fetchMarketDataCategory(category) {
      const pageSize = 1000;
      const rows = [];
      for (let offset = 0; ; offset += pageSize) {
        const params = new URLSearchParams({
          select: "id,category,region,value,base_date,source,extra_info,lat,lng",
          source: `eq.${MAP_CONFIG.marketDataSource}`,
          category: `eq.${category}`,
          order: "id.asc",
          limit: String(pageSize),
          offset: String(offset),
        });
        const response = await fetch(`${MAP_CONFIG.supabaseUrl}/rest/v1/market_data?${params.toString()}`, {
          headers: {
            apikey: MAP_CONFIG.supabaseKey,
            Authorization: `Bearer ${MAP_CONFIG.supabaseKey}`,
          },
        });
        if (!response.ok) {
          throw new Error(`market_data fetch failed: ${category} ${response.status}`);
        }
        const page = await response.json();
        rows.push(...page);
        if (page.length < pageSize) break;
      }
      return rows;
    }

    function buildSurfaceDataFromMarketRows(groups) {
      const metaInfo = rowExtraInfo(groups.meta[0]);
      if (!metaInfo.meta || !metaInfo.grid || !Array.isArray(metaInfo.periods)) {
        throw new Error("market_data meta row is missing dashboard metadata");
      }
      const surfaces = {};
      for (const row of groups.surface) {
        const info = rowExtraInfo(row);
        if (info.period) surfaces[info.period] = info.values || [];
      }
      const pointsByPeriod = Object.fromEntries(metaInfo.periods.map(period => [period, []]));
      for (const row of groups.observation) {
        const info = rowExtraInfo(row);
        const point = info.point || {};
        const period = info.period || point.period;
        if (!period) continue;
        if (!pointsByPeriod[period]) pointsByPeriod[period] = [];
        if (point.lat == null && row.lat != null) point.lat = row.lat;
        if (point.lon == null && row.lng != null) point.lon = row.lng;
        if (point.noc == null && row.value != null) point.noc = row.value;
        delete point.period;
        pointsByPeriod[period].push(point);
      }
      const tenantCases = groups.tenantCase.map(row => {
        const info = rowExtraInfo(row);
        const item = info.case || {};
        if (item.lat == null && row.lat != null) item.lat = row.lat;
        if (item.lon == null && row.lng != null) item.lon = row.lng;
        return item;
      });
      const transactionCases = (groups.transactionCase || []).map(row => {
        const info = rowExtraInfo(row);
        const item = info.case || {};
        if (item.lat == null && row.lat != null) item.lat = row.lat;
        if (item.lon == null && row.lng != null) item.lon = row.lng;
        return item;
      });
      const buildingByPnu = {};
      for (const row of groups.buildingOverview) {
        const info = rowExtraInfo(row);
        if (info.pnu) buildingByPnu[info.pnu] = info.overview || {};
      }
      return {
        meta: metaInfo.meta,
        grid: metaInfo.grid,
        periods: metaInfo.periods,
        surfaces,
        pointsByPeriod,
        tenantCases,
        transactionCases,
        buildingByPnu,
        labels: metaInfo.labels || {},
        referenceLines: metaInfo.referenceLines || [],
        localVector: metaInfo.localVector || { available: false },
      };
    }

    async function loadSurfaceData() {
      if (marketDataConfigured()) {
        try {
          const categories = MAP_CONFIG.marketDataCategories;
          const [meta, surface, observation, tenantCase, transactionCase, buildingOverview] = await Promise.all([
            fetchMarketDataCategory(categories.meta),
            fetchMarketDataCategory(categories.surface),
            fetchMarketDataCategory(categories.observation),
            fetchMarketDataCategory(categories.tenantCase),
            categories.transactionCase ? fetchMarketDataCategory(categories.transactionCase) : Promise.resolve([]),
            fetchMarketDataCategory(categories.buildingOverview),
          ]);
          if (meta.length && surface.length && observation.length) {
            const marketData = buildSurfaceDataFromMarketRows({ meta, surface, observation, tenantCase, transactionCase, buildingOverview });
            marketData.meta.sourceMode = "supabase_market_data";
            marketData.meta.marketDataSource = MAP_CONFIG.marketDataSource;
            return marketData;
          }
        } catch (error) {
          console.warn("Supabase market_data load failed; falling back to local JSON", error);
        }
      }
      const localData = await fetch(`${DATA_URL}?v=${Date.now()}`).then(r => r.json());
      localData.meta.sourceMode = "local_json";
      return localData;
    }

    async function boot() {
      data = await loadSurfaceData();
      window.rentMapData = data;
      document.body.dataset.sourceMode = data.meta.sourceMode || "";
      document.getElementById("legendMin").textContent = `P03 ${fmt.format(data.meta.valueDomain.p03)}`;
      document.getElementById("legendP97").textContent = `P97 ${fmt.format(data.meta.valueDomain.p97)}`;
      document.getElementById("legendMax").textContent = `Max ${fmt.format(data.meta.valueDomain.max)}`;
      setupScene();
      setupMapProviderControl();
      buildSurface();
      await buildBase();
      buildMapReferences();
      buildLocalVectorLayer();
      if (activeMapProvider().vectorSource === "seoul") await ensureSeoulVectorLayer();
      periodSlider.max = data.periods.length - 1;
      periodSlider.value = data.periods.length - 1;
      setPeriod(data.periods[data.periods.length - 1]);
      bindEvents();
      loading.style.display = "none";
      animate();
    }

    function setupScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111820);
      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      app.appendChild(renderer.domElement);
      camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 2, 10000);
      camera.position.set(0, 1700, 1250);
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 85, 0);
      controls.maxPolarAngle = Math.PI * 0.47;
      controls.minDistance = 42;
      controls.maxDistance = 6400;
      scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.25));
      const sun = new THREE.DirectionalLight(0xffffff, 1.0);
      sun.position.set(850, 1700, 1200);
      scene.add(sun);
      raycaster = new THREE.Raycaster();
      pointer = new THREE.Vector2();
      raycaster.params.Points.threshold = 8;
    }

    async function buildBase() {
      const mapLayer = await buildMapTexture();
      if (mapLayer) {
        baseMapPlane = mapLayer;
        scene.add(baseMapPlane);
        return;
      }

      const xs = data.grid.xs;
      const ys = data.grid.ys;
      const w = (xs[xs.length - 1] - xs[0]) * horizontalScale;
      const h = (ys[ys.length - 1] - ys[0]) * horizontalScale;
      baseMapPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: 0xe8edf1, side: THREE.DoubleSide })
      );
      baseMapPlane.rotation.x = -Math.PI / 2;
      baseMapPlane.position.y = mapPlaneY;
      scene.add(baseMapPlane);
    }

    async function buildMapTexture() {
      const bounds = data.meta.boundsLatLon;
      if (!bounds) return null;
      const displayProvider = activeMapProvider();
      const provider = baseTileProvider(displayProvider);
      if (provider.type === "local") return null;
      const blend = tileBlend(displayProvider, "base");
      const baseZoom = provider.baseZoom || 13;
      let x0 = Math.floor(lonToTileX(bounds.west, baseZoom)) - 1;
      let x1 = Math.floor(lonToTileX(bounds.east, baseZoom)) + 1;
      let y0 = Math.floor(latToTileY(bounds.north, baseZoom)) - 1;
      let y1 = Math.floor(latToTileY(bounds.south, baseZoom)) + 1;
      const cols = x1 - x0 + 1;
      const rows = y1 - y0 + 1;
      if (cols <= 0 || rows <= 0 || cols * rows > 220) return null;

      const canvas = document.createElement("canvas");
      canvas.width = cols * tileSize;
      canvas.height = rows * tileSize;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let loaded = 0;
      const jobs = [];
      for (let ty = y0; ty <= y1; ty++) {
        for (let tx = x0; tx <= x1; tx++) {
          const urls = mapTileUrls(provider, baseZoom, tx, ty, provider.retina);
          const fallbackUrls = provider.retina ? mapTileUrls(provider, baseZoom, tx, ty, false) : [];
          if (!urls.length) continue;
          jobs.push(loadTileStack(urls, fallbackUrls).then(images => {
            if (images.length) {
              ctx.save();
              ctx.globalAlpha = blend;
              for (const img of images) ctx.drawImage(img, (tx - x0) * tileSize, (ty - y0) * tileSize, tileSize, tileSize);
              ctx.restore();
              loaded += images.length;
            }
          }));
        }
      }
      await Promise.all(jobs);
      if (!loaded) return null;

      const west = tileXToLon(x0, baseZoom);
      const east = tileXToLon(x1 + 1, baseZoom);
      const north = tileYToLat(y0, baseZoom);
      const south = tileYToLat(y1 + 1, baseZoom);
      const [xWest] = xyFromLonLat(west, data.meta.center.lat);
      const [xEast] = xyFromLonLat(east, data.meta.center.lat);
      const [, ySouth] = xyFromLonLat(data.meta.center.lon, south);
      const [, yNorth] = xyFromLonLat(data.meta.center.lon, north);
      const width = Math.abs(xEast - xWest) * horizontalScale;
      const height = Math.abs(yNorth - ySouth) * horizontalScale;

      const texture = new THREE.CanvasTexture(canvas);
      texture.encoding = THREE.sRGBEncoding;
      texture.generateMipmaps = false;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1);
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide })
      );
      plane.rotation.x = -Math.PI / 2;
      plane.position.set(((xWest + xEast) / 2) * horizontalScale, mapPlaneY, -((ySouth + yNorth) / 2) * horizontalScale);
      return plane;
    }

    function currentFocusMapSpec() {
      const distance = camera && controls ? camera.position.distanceTo(controls.target) : 9999;
      const specs = activeMapProvider().focusSpecs;
      return specs.find(spec => distance <= spec.maxDistance) || specs[specs.length - 1];
    }

    function makeFocusMapKey(point, spec) {
      const id = point.assetId || `${point.lat},${point.lon}`;
      return `${activeMapProviderId}:${id}:${spec.z}:${spec.radius}`;
    }

    async function updateFocusMap(point, options = {}) {
      if (!point || !Number.isFinite(Number(point.lat)) || !Number.isFinite(Number(point.lon))) return;
      const spec = currentFocusMapSpec();
      const key = makeFocusMapKey(point, spec);
      if (!options.force && focusMapPlane && focusMapKey === key) return;
      const requestId = ++focusMapRequestId;
      const plane = await buildFocusMapTexture(point, spec);
      if (requestId !== focusMapRequestId) {
        disposeMapPlane(plane);
        return;
      }
      removeFocusMapPlane();
      if (plane) {
        focusMapPlane = plane;
        focusMapKey = key;
        scene.add(focusMapPlane);
      }
    }

    function clearFocusMap() {
      focusMapRequestId += 1;
      focusMapKey = "";
      removeFocusMapPlane();
    }

    function removeBaseMapPlane() {
      if (!baseMapPlane) return;
      scene.remove(baseMapPlane);
      disposeMapPlane(baseMapPlane);
      baseMapPlane = null;
    }

    function removeFocusMapPlane() {
      if (!focusMapPlane) return;
      scene.remove(focusMapPlane);
      disposeMapPlane(focusMapPlane);
      focusMapPlane = null;
    }

    function disposeMapPlane(plane) {
      if (!plane) return;
      if (plane.material && plane.material.map) plane.material.map.dispose();
      if (plane.material) plane.material.dispose();
      if (plane.geometry) plane.geometry.dispose();
    }

    async function buildFocusMapTexture(point, spec) {
      const displayProvider = activeMapProvider();
      const provider = baseTileProvider(displayProvider);
      if (provider.type === "local") return null;
      const blend = tileBlend(displayProvider, "focus");
      const z = spec.z;
      const centerX = Math.floor(lonToTileX(point.lon, z));
      const centerY = Math.floor(latToTileY(point.lat, z));
      const radius = spec.radius;
      const x0 = centerX - radius;
      const x1 = centerX + radius;
      const y0 = centerY - radius;
      const y1 = centerY + radius;
      const cols = x1 - x0 + 1;
      const rows = y1 - y0 + 1;
      const maxTextureSize = renderer.capabilities.maxTextureSize || 8192;
      const providerTileSize = provider.tileSize || tileSize;
      const drawTileSize = Math.max(tileSize, Math.min(providerTileSize, Math.floor(maxTextureSize / Math.max(cols, rows))));
      const canvas = document.createElement("canvas");
      canvas.width = cols * drawTileSize;
      canvas.height = rows * drawTileSize;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let loaded = 0;
      const jobs = [];
      for (let ty = y0; ty <= y1; ty++) {
        for (let tx = x0; tx <= x1; tx++) {
          const urls = mapTileUrls(provider, z, tx, ty, provider.retina);
          const fallbackUrls = provider.retina ? mapTileUrls(provider, z, tx, ty, false) : [];
          if (!urls.length) continue;
          jobs.push(loadTileStack(urls, fallbackUrls).then(images => {
            if (images.length) {
              ctx.save();
              ctx.globalAlpha = blend;
              for (const img of images) ctx.drawImage(img, (tx - x0) * drawTileSize, (ty - y0) * drawTileSize, drawTileSize, drawTileSize);
              ctx.restore();
              loaded += images.length;
            }
          }));
        }
      }
      await Promise.all(jobs);
      if (!loaded) return null;

      const west = tileXToLon(x0, z);
      const east = tileXToLon(x1 + 1, z);
      const north = tileYToLat(y0, z);
      const south = tileYToLat(y1 + 1, z);
      const [xWest] = xyFromLonLat(west, data.meta.center.lat);
      const [xEast] = xyFromLonLat(east, data.meta.center.lat);
      const [, ySouth] = xyFromLonLat(data.meta.center.lon, south);
      const [, yNorth] = xyFromLonLat(data.meta.center.lon, north);
      const width = Math.abs(xEast - xWest) * horizontalScale;
      const height = Math.abs(yNorth - ySouth) * horizontalScale;
      const texture = new THREE.CanvasTexture(canvas);
      texture.encoding = THREE.sRGBEncoding;
      texture.generateMipmaps = false;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1);
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide })
      );
      plane.rotation.x = -Math.PI / 2;
      plane.position.set(((xWest + xEast) / 2) * horizontalScale, mapPlaneY + 0.02, -((ySouth + yNorth) / 2) * horizontalScale);
      plane.renderOrder = 2;
      return plane;
    }

    function mapTileUrls(provider, z, tx, ty, retina = false) {
      if (provider.type === "vworld") {
        if (!MAP_CONFIG.vworldKey) return [];
        const layers = provider.layers || [provider];
        return layers.map(layer => `https://api.vworld.kr/req/wmts/1.0.0/${encodeURIComponent(MAP_CONFIG.vworldKey)}/${layer.layer}/${z}/${ty}/${tx}.${layer.extension || "png"}`);
      }
      const subdomains = provider.subdomains || ["a", "b", "c", "d"];
      const sub = subdomains[Math.abs(tx + ty) % subdomains.length];
      return [`https://cartodb-basemaps-${sub}.global.ssl.fastly.net/rastertiles/voyager/${z}/${tx}/${ty}${retina ? "@2x" : ""}.png`];
    }

    async function loadTileStack(urls, fallbackUrls = []) {
      const images = [];
      for (let i = 0; i < urls.length; i++) {
        const img = await loadTile(urls[i], fallbackUrls[i] || null);
        if (img) images.push(img);
      }
      return images;
    }

    function loadTile(url, fallbackUrl = null) {
      if (tileImageCache.has(url)) {
        return tileImageCache.get(url).then(img => img || (fallbackUrl ? loadTile(fallbackUrl) : null));
      }
      const promise = new Promise(resolve => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
      });
      tileImageCache.set(url, promise);
      return promise.then(img => img || (fallbackUrl ? loadTile(fallbackUrl) : null));
    }

    function makeTextSprite(text, options = {}) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const fontSize = options.fontSize || 34;
      const paddingX = 18;
      const paddingY = 10;
      ctx.font = `700 ${fontSize}px Arial, Noto Sans KR, sans-serif`;
      const metrics = ctx.measureText(text);
      canvas.width = Math.ceil(metrics.width + paddingX * 2);
      canvas.height = Math.ceil(fontSize + paddingY * 2);
      ctx.font = `700 ${fontSize}px Arial, Noto Sans KR, sans-serif`;
      ctx.textBaseline = "middle";
      ctx.fillStyle = options.background || "rgba(255,255,255,0.86)";
      roundRect(ctx, 0, 0, canvas.width, canvas.height, 10);
      ctx.fill();
      ctx.fillStyle = options.color || "#17202a";
      ctx.fillText(text, paddingX, canvas.height / 2 + 1);
      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
      const scale = options.scale || 0.8;
      sprite.userData.labelKind = options.kind || "label";
      sprite.userData.canvasWidth = canvas.width;
      sprite.userData.canvasHeight = canvas.height;
      sprite.userData.baseScale = scale;
      sprite.scale.set(canvas.width * scale, canvas.height * scale, 1);
      sprite.renderOrder = 20;
      return sprite;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function addLabel(text, x, z, y, options = {}) {
      const sprite = makeTextSprite(text, options);
      sprite.position.set(x, y, z);
      sprite.userData.baseX = x;
      sprite.userData.baseY = y;
      sprite.userData.baseZ = z;
      labelGroup.add(sprite);
      return sprite;
    }

    function addVectorSegments(group, features, color, opacity, y, renderOrder) {
      const verts = [];
      const addRing = (ring) => {
        if (!Array.isArray(ring) || ring.length < 2) return;
        for (let i = 0; i < ring.length; i++) {
          const a = ring[i];
          const b = ring[(i + 1) % ring.length];
          if (!Array.isArray(a) || !Array.isArray(b)) continue;
          verts.push(sx(a[0]), y, sz(a[1]), sx(b[0]), y, sz(b[1]));
        }
      };
      const addLine = (line) => {
        if (!Array.isArray(line) || line.length < 2) return;
        for (let i = 0; i < line.length - 1; i++) {
          const a = line[i];
          const b = line[i + 1];
          if (!Array.isArray(a) || !Array.isArray(b)) continue;
          verts.push(sx(a[0]), y, sz(a[1]), sx(b[0]), y, sz(b[1]));
        }
      };
      for (const feature of features || []) {
        const geometry = feature.geometry || {};
        const coords = geometry.coordinates || [];
        if (geometry.type === "Polygon") {
          for (const ring of coords) addRing(ring);
        } else if (geometry.type === "MultiPolygon") {
          for (const polygon of coords) for (const ring of polygon) addRing(ring);
        } else if (geometry.type === "LineString") {
          addLine(coords);
        } else if (geometry.type === "MultiLineString") {
          for (const line of coords) addLine(line);
        }
      }
      if (!verts.length) return;
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
      const material = new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthTest: false });
      const mesh = new THREE.LineSegments(geometry, material);
      mesh.renderOrder = renderOrder;
      group.add(mesh);
    }
