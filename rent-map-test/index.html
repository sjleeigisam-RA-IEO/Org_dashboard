    function clearContextLabels() {
      contextLabelRequestId += 1;
      if (!contextLabelGroup) return;
      for (const child of [...contextLabelGroup.children]) {
        contextLabelGroup.remove(child);
        if (child.material && child.material.map) child.material.map.dispose();
        if (child.material) child.material.dispose();
        if (child.geometry) child.geometry.dispose();
      }
    }

    function contextLabelCacheKey(point) {
      return `${Math.round(Number(point.lat) * 10000)}:${Math.round(Number(point.lon) * 10000)}`;
    }

    function buildOverpassQuery(point) {
      const lat = Number(point.lat);
      const lon = Number(point.lon);
      return `
        [out:json][timeout:14];
        (
          way(around:780,${lat},${lon})["highway"]["name"];
          node(around:1400,${lat},${lon})["railway"="station"]["name"];
          way(around:1400,${lat},${lon})["railway"="station"]["name"];
          relation(around:1400,${lat},${lon})["railway"="station"]["name"];
          node(around:1400,${lat},${lon})["station"="subway"]["name"];
          way(around:1400,${lat},${lon})["station"="subway"]["name"];
          relation(around:1400,${lat},${lon})["station"="subway"]["name"];
          node(around:1400,${lat},${lon})["subway"="yes"]["name"];
          way(around:1400,${lat},${lon})["subway"="yes"]["name"];
          relation(around:1400,${lat},${lon})["subway"="yes"]["name"];
          node(around:1400,${lat},${lon})["railway"="subway_entrance"]["name"];
        );
        out tags center 160;
      `;
    }

    async function fetchContextElements(point) {
      const query = buildOverpassQuery(point);
      const endpoints = [
        "https://overpass-api.de/api/interpreter",
        "https://overpass.kumi.systems/api/interpreter",
      ];
      for (const endpoint of endpoints) {
        try {
          const response = await fetch(`${endpoint}?data=${encodeURIComponent(query)}`);
          if (!response.ok) continue;
          const payload = await response.json();
          if (payload && Array.isArray(payload.elements)) return payload.elements;
        } catch (err) {
          console.warn("Context label fetch failed", err);
        }
      }
      return [];
    }

    function roadRank(highway) {
      const ranks = {
        motorway: 1, trunk: 2, primary: 3, secondary: 4, tertiary: 5,
        unclassified: 6, residential: 7, living_street: 8, service: 9,
      };
      return ranks[highway] || 10;
    }

    function normalizeLabelName(name) {
      return String(name || "").replace(/\s+/g, " ").trim();
    }

    function isStationTags(tags) {
      if (!tags || !tags.name) return false;
      return tags.station === "subway" || tags.subway === "yes" ||
        tags.railway === "station" || tags.railway === "stop";
    }

    function parseContextLabels(elements, point) {
      const labels = [];
      const seen = new Set();
      for (const element of elements) {
        const tags = element.tags || {};
        const center = element.center || element;
        const lat = Number(center.lat);
        const lon = Number(center.lon);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
        const [x, y] = xyFromLonLat(lon, lat);
        const distance = Math.hypot(x - point.x, y - point.y);

        if (isStationTags(tags)) {
          if (distance > 1400) continue;
          const name = normalizeLabelName(tags.name);
          const key = `station:${name}`;
          if (!name || seen.has(key)) continue;
          seen.add(key);
          labels.push({ type: "station", name: `M ${name}`, x, y, distance, rank: 0 });
          continue;
        }

        if (tags.highway && tags.name && distance <= 780) {
          const rank = roadRank(tags.highway);
          if (rank > 9) continue;
          const name = normalizeLabelName(tags.name);
          const key = `road:${name}`;
          if (!name || seen.has(key)) continue;
          seen.add(key);
          labels.push({ type: "road", name, x, y, distance, rank });
        }
      }

      labels.sort((a, b) => {
        if (a.type !== b.type) return a.type === "station" ? -1 : 1;
        return a.rank - b.rank || a.distance - b.distance;
      });

      const selected = [];
      for (const label of labels) {
        const maxCount = label.type === "station" ? 6 : 12;
        if (selected.filter(item => item.type === label.type).length >= maxCount) continue;
        if (selected.some(item => Math.hypot(item.x - label.x, item.y - label.y) < (label.type === "station" ? 120 : 132))) continue;
        selected.push(label);
      }
      return selected.slice(0, 18);
    }

    async function loadContextLabels() {
      if (contextLabelsData) return contextLabelsData;
      if (!contextLabelsPromise) {
        contextLabelsPromise = fetch(`${CONTEXT_LABELS_URL}?v=${Date.now()}`)
          .then(response => response.ok ? response.json() : [])
          .then(rows => {
            contextLabelsData = Array.isArray(rows) ? rows : [];
            return contextLabelsData;
          })
          .catch(err => {
            console.warn("Local context labels failed", err);
            contextLabelsData = [];
            return contextLabelsData;
          });
      }
      return contextLabelsPromise;
    }

    function selectLocalContextLabels(point) {
      const source = contextLabelsData || [];
      const labels = [];
      for (const row of source) {
        const x = Number(row.x);
        const y = Number(row.y);
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        const distance = Math.hypot(x - point.x, y - point.y);
        if (row.type === "station") {
          if (distance <= 1450) labels.push({ ...row, x, y, distance, rank: 0 });
        } else if (row.type === "road" && distance <= 780) {
          labels.push({ ...row, x, y, distance, rank: Number(row.rank || 9) });
        }
      }
      labels.sort((a, b) => {
        if (a.type !== b.type) return a.type === "station" ? -1 : 1;
        return a.rank - b.rank || a.distance - b.distance;
      });
      const selected = [];
      for (const label of labels) {
        const maxCount = label.type === "station" ? 6 : 12;
        if (selected.filter(item => item.type === label.type).length >= maxCount) continue;
        if (selected.some(item => Math.hypot(item.x - label.x, item.y - label.y) < (label.type === "station" ? 120 : 132))) continue;
        selected.push(label);
      }
      return selected.slice(0, 18);
    }

    async function updateContextLabels(point) {
      return;
      if (!contextLabelGroup || !point || !Number.isFinite(Number(point.lat)) || !Number.isFinite(Number(point.lon))) return;
      const requestId = ++contextLabelRequestId;
      const key = contextLabelCacheKey(point);
      let labels = contextLabelCache.get(key);
      if (!labels) {
        await loadContextLabels();
        labels = selectLocalContextLabels(point);
        if (!labels.length) {
          const elements = await fetchContextElements(point);
          labels = parseContextLabels(elements, point);
        }
        contextLabelCache.set(key, labels);
      }
      if (requestId !== contextLabelRequestId) return;
      clearContextLabels();
      contextLabelRequestId = requestId;
      contextLabelGroup.visible = toggleLabels.checked && reviewMode;
      window.__contextLabels = labels.map(label => ({
        type: label.type,
        name: label.name,
        distance: Math.round(label.distance),
      }));
      for (const label of labels) {
        const isStation = label.type === "station";
        const sprite = makeTextSprite(label.name, {
          fontSize: isStation ? 27 : 23,
          scale: isStation ? 0.052 : 0.036,
          color: isStation ? "#0f3f8f" : "#111827",
          background: isStation ? "rgba(219,234,254,0.94)" : "rgba(255,255,255,0.90)",
          kind: "context",
        });
        sprite.userData.labelText = label.name;
        sprite.userData.labelType = label.type;
        sprite.position.set(sx(label.x), columnGroundY + (isStation ? 5.8 : 4.2), sz(label.y));
        sprite.renderOrder = 46;
        contextLabelGroup.add(sprite);
      }

      const nearestStations = labels.filter(label => label.type === "station").slice(0, 3);
      nearestStations.forEach((label, index) => {
        const angle = Math.atan2(label.y - point.y, label.x - point.x);
        const offset = 170 + index * 62;
        const calloutText = `${label.name} ${fmt.format(Math.round(label.distance))}m`;
        const sprite = makeTextSprite(calloutText, {
          fontSize: 27,
          scale: 0.058,
          color: "#0f3f8f",
          background: "rgba(219,234,254,0.96)",
          kind: "contextStationSummary",
        });
        sprite.userData.labelText = calloutText;
        sprite.userData.labelType = "stationSummary";
        sprite.position.set(
          sx(point.x + Math.cos(angle) * offset),
          columnGroundY + 9.0 + index * 0.6,
          sz(point.y + Math.sin(angle) * offset)
        );
        sprite.renderOrder = 52;
        contextLabelGroup.add(sprite);
      });
    }

    function buildSurface() {
      const nx = data.grid.nx;
      const ny = data.grid.ny;
      const xs = data.grid.xs;
      const ys = data.grid.ys;
      const vertices = [];
      const colors = [];
      const indices = [];
      for (let j = 0; j < ny; j++) {
        for (let i = 0; i < nx; i++) {
          vertices.push(sx(xs[i]), 0, sz(ys[j]));
          colors.push(1, 1, 1);
        }
      }
      for (let j = 0; j < ny - 1; j++) {
        for (let i = 0; i < nx - 1; i++) {
          const a = j * nx + i;
          const b = a + 1;
          const c = a + nx;
          const d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setIndex(indices);
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      positionArray = geometry.attributes.position.array;
      colorArray = geometry.attributes.color.array;
      surface = new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          transparent: true,
          opacity: 0.58,
          roughness: 0.74,
          metalness: 0.03,
          depthWrite: false,
          side: THREE.DoubleSide,
        })
      );
      scene.add(surface);
    }

    function updateSurface(period) {
      const values = data.surfaces[period];
      const stats = periodStats(period).surface;
      for (let idx = 0; idx < values.length; idx++) {
        positionArray[idx * 3 + 1] = height(values[idx]);
        const c = surfaceColorFor(values[idx], stats);
        colorArray[idx * 3] = c.r;
        colorArray[idx * 3 + 1] = c.g;
        colorArray[idx * 3 + 2] = c.b;
      }
      surface.geometry.attributes.position.needsUpdate = true;
      surface.geometry.attributes.color.needsUpdate = true;
      surface.geometry.computeVertexNormals();
    }

    function disposeObject3D(object) {
      if (!object) return;
      object.traverse(child => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) child.material.forEach(material => material.dispose());
          else child.material.dispose();
        }
      });
    }

    function contourSegments(values, level) {
      const xs = data.grid.xs;
      const ys = data.grid.ys;
      const nx = data.grid.nx;
      const ny = data.grid.ny;
      const positions = [];
      const interpolate = (a, b) => {
        const denom = b.v - a.v;
        const t = Math.abs(denom) < 0.000001 ? 0.5 : (level - a.v) / denom;
        return {
          x: a.x + (b.x - a.x) * t,
          y: a.y + (b.y - a.y) * t,
        };
      };
      const addSegment = (a, b) => {
        const y = height(level) + 2.4;
        positions.push(sx(a.x), y, sz(a.y), sx(b.x), y, sz(b.y));
      };
      for (let j = 0; j < ny - 1; j++) {
        for (let i = 0; i < nx - 1; i++) {
          const corners = [
            { x: xs[i], y: ys[j], v: values[j * nx + i] },
            { x: xs[i + 1], y: ys[j], v: values[j * nx + i + 1] },
            { x: xs[i + 1], y: ys[j + 1], v: values[(j + 1) * nx + i + 1] },
            { x: xs[i], y: ys[j + 1], v: values[(j + 1) * nx + i] },
          ];
          if (corners.some(corner => !Number.isFinite(corner.v))) continue;
          const cuts = [];
          const edges = [[0, 1], [1, 2], [2, 3], [3, 0]];
          for (const [aIdx, bIdx] of edges) {
            const a = corners[aIdx];
            const b = corners[bIdx];
            if ((a.v < level && b.v >= level) || (a.v >= level && b.v < level)) {
              cuts.push(interpolate(a, b));
            }
          }
          if (cuts.length === 2) addSegment(cuts[0], cuts[1]);
          else if (cuts.length === 4) {
            addSegment(cuts[0], cuts[1]);
            addSegment(cuts[2], cuts[3]);
          }
        }
      }
      return positions;
    }

    function updateHighContours(period) {
      if (highContourGroup) {
        scene.remove(highContourGroup);
        disposeObject3D(highContourGroup);
      }
      highContourGroup = new THREE.Group();
      highContourGroup.userData.kind = "highContours";
      const values = data.surfaces[period] || [];
      const stats = periodStats(period).surface;
      const levels = [
        { label: "mean", value: stats.mean, color: 0xfff3c4, opacity: 0.62 },
        { label: "top10", value: stats.p90, color: 0xff335f, opacity: 0.86 },
      ];
      for (const level of levels) {
        if (!Number.isFinite(level.value)) continue;
        const positions = contourSegments(values, level.value);
        if (!positions.length) continue;
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        const shadow = new THREE.LineSegments(
          geometry.clone(),
          new THREE.LineBasicMaterial({
            color: 0x172033,
            transparent: true,
            opacity: level.opacity * 0.38,
            depthTest: false,
            depthWrite: false,
          })
        );
        shadow.renderOrder = 30;
        const line = new THREE.LineSegments(
          geometry,
          new THREE.LineBasicMaterial({
            color: level.color,
            transparent: true,
            opacity: level.opacity,
            depthTest: false,
            depthWrite: false,
          })
        );
        line.renderOrder = 31;
        highContourGroup.add(shadow);
        highContourGroup.add(line);
      }
      highContourGroup.visible = Boolean(toggleSurface.checked && !reviewMode);
      scene.add(highContourGroup);
    }

    function surfaceHeightAt(x, y, values = data.surfaces[currentPeriod]) {
      const nx = data.grid.nx;
      const ny = data.grid.ny;
      const xs = data.grid.xs;
      const ys = data.grid.ys;
      const dx = (xs[xs.length - 1] - xs[0]) / (nx - 1);
      const dy = (ys[ys.length - 1] - ys[0]) / (ny - 1);
      const fx = Math.max(0, Math.min(nx - 1.001, (x - xs[0]) / dx));
      const fy = Math.max(0, Math.min(ny - 1.001, (y - ys[0]) / dy));
      const i = Math.floor(fx);
      const j = Math.floor(fy);
      const tx = fx - i;
      const ty = fy - j;
      const i1 = Math.min(i + 1, nx - 1);
      const j1 = Math.min(j + 1, ny - 1);
      const v00 = values[j * nx + i];
      const v10 = values[j * nx + i1];
      const v01 = values[j1 * nx + i];
      const v11 = values[j1 * nx + i1];
      const v0 = v00 + (v10 - v00) * tx;
      const v1 = v01 + (v11 - v01) * tx;
      return height(v0 + (v1 - v0) * ty);
    }

    function buildPoints(period) {
      if (pointMesh) scene.remove(pointMesh);
      currentPoints = data.pointsByPeriod[period] || [];
      const geometry = new THREE.CylinderGeometry(1, 1, 1, 12, 1, false);
      const bucketCount = 21;
      const buckets = Array.from({ length: bucketCount }, () => []);
      for (let i = 0; i < currentPoints.length; i++) {
        const bucket = Math.min(bucketCount - 1, Math.floor(normalize(currentPoints[i].noc) * bucketCount));
        buckets[bucket].push(i);
      }
      pointMesh = new THREE.Group();
      pointMesh.userData.kind = "observedPoint";
      const matrix = new THREE.Matrix4();
      const visualScale = columnZoomScale();
      for (let bucket = 0; bucket < buckets.length; bucket++) {
        const indices = buckets[bucket];
        if (!indices.length) continue;
        const sample = valueForVisualNorm((bucket + 0.5) / bucketCount);
        const material = new THREE.MeshBasicMaterial({
          color: colorFor(sample),
          transparent: true,
          opacity: 0.92,
        });
        const mesh = new THREE.InstancedMesh(geometry, material, indices.length);
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        mesh.userData.pointIndices = indices;
        for (let localIndex = 0; localIndex < indices.length; localIndex++) {
          const point = currentPoints[indices[localIndex]];
          composeColumnMatrix(matrix, point, visualScale);
          mesh.setMatrixAt(localIndex, matrix);
        }
        mesh.instanceMatrix.needsUpdate = true;
        pointMesh.add(mesh);
      }
      lastColumnVisualScale = visualScale;
      pointMesh.visible = togglePoints.checked;
      scene.add(pointMesh);
    }

    function transactionPoint(tx) {
      return {
        isTransaction: true,
        assetId: `transaction:${tx.transactionCaseId || tx.pnu || tx.building}`,
        pnu: tx.pnu,
        building: tx.building || "매매사례",
        region: tx.region || "",
        gu: tx.gu || "",
        dong: tx.dong || "",
        x: tx.x,
        y: tx.y,
        lat: tx.lat,
        lon: tx.lon,
        noc: data.meta.valueDomain.p03,
        transaction: tx,
        tenantCount: 0,
        tenants: [],
      };
    }

    function transactionValueNorm(value) {
      const values = (data.transactionCases || [])
        .map(tx => Number(tx.dealPriceThousandKrw))
        .filter(value => Number.isFinite(value) && value > 0)
        .sort((a, b) => a - b);
      if (!values.length) return 0.5;
      const min = Math.log(values[0]);
      const max = Math.log(values[values.length - 1]);
      const n = Math.log(Math.max(1, Number(value) || values[0]));
      return THREE.MathUtils.clamp((n - min) / (max - min || 1), 0, 1);
    }

    function buildTransactions(period) {
      if (transactionGroup) {
        scene.remove(transactionGroup);
        disposeObject3D(transactionGroup);
      }
      currentTransactions = (data.transactionCases || []).filter(tx =>
        tx.period === period && Number.isFinite(Number(tx.x)) && Number.isFinite(Number(tx.y))
      );
      transactionGroup = new THREE.Group();
      transactionGroup.userData.kind = "transactionCase";
      const geometry = new THREE.CylinderGeometry(1, 1, 1, 24, 1, false);
      const bucketCount = 6;
      const buckets = Array.from({ length: bucketCount }, () => []);
      for (let i = 0; i < currentTransactions.length; i++) {
        const n = transactionValueNorm(currentTransactions[i].dealPriceThousandKrw);
        buckets[Math.min(bucketCount - 1, Math.floor(n * bucketCount))].push(i);
      }
      const matrix = new THREE.Matrix4();
      const colors = [0x8b5cf6, 0x7c3aed, 0xa855f7, 0xd946ef, 0xf59e0b, 0xf97316];
      for (let bucket = 0; bucket < buckets.length; bucket++) {
        const indices = buckets[bucket];
        if (!indices.length) continue;
        const material = new THREE.MeshBasicMaterial({
          color: colors[bucket],
          transparent: true,
          opacity: 0.56,
          depthWrite: false,
        });
        const mesh = new THREE.InstancedMesh(geometry, material, indices.length);
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        mesh.userData.transactionIndices = indices;
        for (let localIndex = 0; localIndex < indices.length; localIndex++) {
          const tx = currentTransactions[indices[localIndex]];
          const n = transactionValueNorm(tx.dealPriceThousandKrw);
          const radius = 0.85 + n * 1.55;
          const markerHeight = 0.55 + n * 1.15;
          matrix.compose(
            new THREE.Vector3(sx(tx.x), columnGroundY + markerHeight / 2 + 0.35, sz(tx.y)),
            new THREE.Quaternion(),
            new THREE.Vector3(radius, markerHeight, radius)
          );
          mesh.setMatrixAt(localIndex, matrix);
        }
        mesh.instanceMatrix.needsUpdate = true;
        transactionGroup.add(mesh);
      }
      transactionGroup.visible = toggleTransactions.checked;
      scene.add(transactionGroup);
    }

    function updateColumnScale(force = false) {
      if (!pointMesh || !pointMesh.children.length) return;
      const visualScale = columnZoomScale();
      if (!force && lastColumnVisualScale !== null && Math.abs(visualScale - lastColumnVisualScale) < 0.012) return;
      lastColumnVisualScale = visualScale;
      const matrix = new THREE.Matrix4();
      for (const mesh of pointMesh.children) {
        const indices = mesh.userData.pointIndices || [];
        for (let localIndex = 0; localIndex < indices.length; localIndex++) {
          composeColumnMatrix(matrix, currentPoints[indices[localIndex]], visualScale);
          mesh.setMatrixAt(localIndex, matrix);
        }
        mesh.instanceMatrix.needsUpdate = true;
      }
      updateSelectedColumn();
      updateHighlightPosition();
      updateSelectionClearButton();
    }

    function selectedColumnHeight(point) {
      if (point && point.isTransaction) return 0;
      return columnHeightForPoint(point);
    }

    function selectedColumnRadius(point) {
      if (point && point.isTransaction) return 0;
      return columnRadiusForPoint(point) * 1.18;
    }

    function ensureSelectedColumn() {
      if (!selectedPoint || selectedPoint.isTransaction) {
        clearSelectedColumn();
        return;
      }
      if (!selectedColumn) {
        selectedColumn = new THREE.Mesh(
          new THREE.CylinderGeometry(1, 1, 1, 20, 1, false),
          new THREE.MeshBasicMaterial({
            color: 0x2563eb,
            transparent: true,
            opacity: 0.96,
            depthTest: false,
          })
        );
        selectedColumn.renderOrder = 38;
        scene.add(selectedColumn);
      }
      updateSelectedColumn();
    }

    function updateSelectedColumn() {
      if (!selectedColumn || !selectedPoint) return;
      const barHeight = selectedColumnHeight(selectedPoint);
      const radius = selectedColumnRadius(selectedPoint);
      selectedColumn.position.set(sx(selectedPoint.x), barHeight / 2 + columnGroundY, sz(selectedPoint.y));
      selectedColumn.scale.set(radius, barHeight, radius);
      selectedColumn.visible = Boolean(reviewMode || selectedPoint);
    }

    function clearSelectedColumn() {
      if (!selectedColumn) return;
      scene.remove(selectedColumn);
      if (selectedColumn.geometry) selectedColumn.geometry.dispose();
      if (selectedColumn.material) selectedColumn.material.dispose();
      selectedColumn = null;
    }

    function setPeriod(period) {
      currentPeriod = period;
      periodSlider.value = data.periods.indexOf(period);
      periodLabel.textContent = period;
      updateSurface(period);
      updateHighContours(period);
      buildPoints(period);
      buildTransactions(period);
      selectedPoint = null;
      if (highlight) highlight.visible = false;
      clearSelectedColumn();
      clearFocusMap();
      clearContextLabels();
      setCloseFocusMode(false);
      renderDetail(null);
      buildCaseList();
      runSearch();
    }

    function activateTab(name) {
      tabButtons.forEach(button => button.classList.toggle("is-active", button.dataset.tab === name));
      tabPanels.forEach(panel => panel.classList.toggle("is-active", panel.id === `tab-${name}`));
    }

    function getBuildingOverview(point) {
      if (!point || !point.pnu || !data.buildingByPnu) return null;
      return data.buildingByPnu[point.pnu] || null;
    }

    function bindEvents() {
      tabButtons.forEach(button => {
        button.addEventListener("click", () => activateTab(button.dataset.tab));
      });
      if (mapProviderSelect) {
        mapProviderSelect.addEventListener("change", event => setMapProvider(event.target.value));
      }
      periodSlider.addEventListener("input", () => setPeriod(data.periods[Number(periodSlider.value)]));
      toggleSurface.addEventListener("change", () => {
        if (!reviewMode) surface.visible = toggleSurface.checked;
        if (highContourGroup) highContourGroup.visible = Boolean(toggleSurface.checked && !reviewMode);
      });
      togglePoints.addEventListener("change", () => pointMesh.visible = togglePoints.checked);
      toggleTransactions.addEventListener("change", () => {
        if (transactionGroup) transactionGroup.visible = toggleTransactions.checked;
        buildCaseList();
      });
      toggleLabels.addEventListener("change", () => {
        labelGroup.visible = toggleLabels.checked;
        referenceGroup.visible = toggleLabels.checked;
        if (contextLabelGroup) contextLabelGroup.visible = false;
      });
      if (toggleLocalVector) {
        toggleLocalVector.addEventListener("change", updateLocalVectorVisibility);
      }
      if (selectionClear) {
        selectionClear.addEventListener("click", event => {
          event.stopPropagation();
          clearSelection({ keepReviewContext: true });
        });
      }
      searchInput.addEventListener("input", runSearch);
      detailPanel.addEventListener("click", event => event.stopPropagation());
      caseListPanel.addEventListener("click", event => event.stopPropagation());
      caseListHeader.addEventListener("click", () => {
        if (!isMobileLayout() || caseListPanel.classList.contains("is-empty")) return;
        setCaseListOpen(!caseListPanel.classList.contains("is-open"));
      });
      caseRows.addEventListener("click", event => {
        const button = event.target.closest(".caseItem");
        if (!button) return;
        const row = currentCaseRows[Number(button.dataset.index)];
        if (!row) return;
        selectPoint(row.point, { zoom: true });
        highlightCaseItem(Number(button.dataset.index));
        if (isMobileLayout()) setCaseListOpen(false);
      });
      window.addEventListener("resize", onResize);
      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("click", onClick);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (!isMobileLayout()) setCaseListOpen(false);
    }

    function pointerToNdc(event) {
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
    }

    function pickPoint(event) {
      if (!pointMesh || !togglePoints.checked) return null;
      pointerToNdc(event);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(pointMesh.children, false);
      if (!hits.length) return null;
      const hit = hits[0];
      return currentPoints[hit.object.userData.pointIndices[hit.instanceId]];
    }

    function pickTransaction(event) {
      if (!transactionGroup || !toggleTransactions.checked) return null;
      pointerToNdc(event);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(transactionGroup.children, false);
      if (!hits.length) return null;
      const hit = hits[0];
      const indices = hit.object.userData.transactionIndices || [];
      const tx = currentTransactions[indices[hit.instanceId]];
      return tx ? transactionPoint(tx) : null;
    }

    function onPointerMove(event) {
      const point = pickPoint(event) || pickTransaction(event);
      if (!point) {
        tooltip.style.display = "none";
        return;
      }
      if (point.isTransaction) {
        const tx = point.transaction;
        tooltip.innerHTML = `<b>${escapeHtml(tx.building)}</b><br>매매사례 ${krwBillionText(tx.dealPriceThousandKrw)}<br>${escapeHtml(tx.period)} · ${escapeHtml(tx.gu)} ${escapeHtml(tx.dong)}`;
      } else {
        tooltip.innerHTML = `<b>${escapeHtml(point.building)}</b><br>NOC ${fmt.format(point.noc)}<br>${escapeHtml(point.gu)} ${escapeHtml(point.dong)}`;
      }
      tooltip.style.left = `${Math.min(event.clientX + 14, window.innerWidth - 280)}px`;
      tooltip.style.top = `${Math.min(event.clientY + 14, window.innerHeight - 120)}px`;
      tooltip.style.display = "block";
    }

    function onClick(event) {
      if (event.target.closest(".panel")) return;
      const point = pickPoint(event) || pickTransaction(event);
      if (point) {
        selectPoint(point, { zoom: true });
      }
    }

    function clearSelection(options = {}) {
      selectedPoint = null;
      if (highlight) highlight.visible = false;
      if (selectionClear) selectionClear.style.display = "none";
      clearSelectedColumn();
      renderDetail(null);
      highlightMatchingCase(null);
      if (!options.keepReviewContext) {
        clearFocusMap();
        clearContextLabels();
        setCloseFocusMode(false);
      }
    }

    function selectPoint(point, options = {}) {
      selectedPoint = point;
      renderDetail(point);
      activateTab("info");
      if (!highlight) {
        highlight = new THREE.Mesh(
          new THREE.RingGeometry(4.5, 6.5, 64),
          new THREE.MeshBasicMaterial({
            color: 0x2563eb,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.88,
            depthTest: false,
          })
        );
        highlight.rotation.x = -Math.PI / 2;
        highlight.renderOrder = 40;
        scene.add(highlight);
      }
      controls.target.set(sx(point.x), options.zoom ? 0 : 120, sz(point.y));
      const destination = options.zoom
        ? new THREE.Vector3(sx(point.x) + 3.8, 46, sz(point.y) + 18)
        : new THREE.Vector3(sx(point.x) + 980, 760, sz(point.y) + 1200);
      if (options.zoom) camera.position.copy(destination);
      else camera.position.lerp(destination, 0.45);
      controls.update();
      if (options.zoom) {
        setCloseFocusMode(true);
        updateFocusMap(point, { force: true });
        clearContextLabels();
      }
      if (point.isTransaction) clearSelectedColumn();
      else ensureSelectedColumn();
      highlight.visible = true;
      updateHighlightPosition();
      if (!options.skipCaseHighlight) highlightMatchingCase(point);
    }

    function updateHighlightPosition() {
      if (!highlight || !selectedPoint) return;
      const ringY = selectedPoint.isTransaction
        ? columnGroundY + 0.08
        : (reviewMode ? columnGroundY + 0.06 : columnTopY(selectedPoint) + 7);
      highlight.position.set(sx(selectedPoint.x), ringY, sz(selectedPoint.y));
      const ringScale = selectedPoint.isTransaction
        ? THREE.MathUtils.clamp(columnZoomScale() * 0.52, 0.12, 0.20)
        : THREE.MathUtils.clamp(columnZoomScale() * 0.86, reviewMode ? 0.16 : 0.16, reviewMode ? 0.22 : 0.40);
      highlight.scale.set(ringScale, ringScale, ringScale);
    }

    function updateSelectionClearButton() {
      if (!selectionClear) return;
      if (!selectedPoint) {
        selectionClear.style.display = "none";
        return;
      }
      if (selectedPoint.isTransaction) {
        selectionClearVector.set(sx(selectedPoint.x) + 10, columnGroundY + 8, sz(selectedPoint.y));
      } else {
        if (!selectedColumn) {
          selectionClear.style.display = "none";
          return;
        }
        const barHeight = selectedColumnHeight(selectedPoint);
        const radius = selectedColumnRadius(selectedPoint);
        selectionClearVector.set(
          sx(selectedPoint.x) + radius * 2.1,
          columnGroundY + barHeight * 0.78,
          sz(selectedPoint.y)
        );
      }
      selectionClearVector.project(camera);
      const x = (selectionClearVector.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-selectionClearVector.y * 0.5 + 0.5) * window.innerHeight;
      const visible = selectionClearVector.z > -1 && selectionClearVector.z < 1 && x >= 0 && x <= window.innerWidth && y >= 0 && y <= window.innerHeight;
      if (!visible) {
        selectionClear.style.display = "none";
        return;
      }
      selectionClear.style.display = "flex";
      selectionClear.style.left = `${x}px`;
      selectionClear.style.top = `${y}px`;
    }

    function isMobileLayout() {
      return window.matchMedia("(max-width: 840px)").matches;
    }

    function setCaseListOpen(open) {
      const shouldOpen = Boolean(open) && isMobileLayout() && !caseListPanel.classList.contains("is-empty");
      caseListPanel.classList.toggle("is-open", shouldOpen);
      document.body.classList.toggle("case-list-open", shouldOpen);
    }

    function setCloseFocusMode(enabled) {
      reviewMode = Boolean(enabled);
      if (surface) surface.visible = enabled ? false : toggleSurface.checked;
      if (surface && surface.material) surface.material.opacity = enabled ? 0.08 : 0.58;
      if (highContourGroup) highContourGroup.visible = enabled ? false : toggleSurface.checked;
      if (pointMesh) {
        pointMesh.visible = togglePoints.checked;
        for (const mesh of pointMesh.children) {
          if (mesh.material) mesh.material.opacity = enabled ? 0.64 : 0.92;
        }
        updateColumnScale(true);
      }
      if (enabled && selectedPoint && !selectedPoint.isTransaction) ensureSelectedColumn();
      else {
        clearSelectedColumn();
        clearContextLabels();
      }
      if (transactionGroup) transactionGroup.visible = toggleTransactions.checked;
      updateHighlightPosition();
      if (enabled) {
        labelGroup.visible = toggleLabels.checked;
        referenceGroup.visible = toggleLabels.checked;
        if (contextLabelGroup) contextLabelGroup.visible = false;
        updateLabelScale(true);
      }
      updateLocalVectorVisibility();
    }

    function buildCaseList() {
      const leaseRows = [];
      for (const point of currentPoints) {
        for (const tenant of point.tenants || []) {
          leaseRows.push({ type: "lease", point, tenant });
        }
      }
      const transactionRows = toggleTransactions.checked
        ? currentTransactions.map(transaction => ({ type: "transaction", point: transactionPoint(transaction), transaction }))
        : [];
      currentCaseRows = [...leaseRows, ...transactionRows];
      currentCaseRows.sort((a, b) =>
        String(a.point.region || "").localeCompare(String(b.point.region || ""), "ko") ||
        String(a.point.gu || "").localeCompare(String(b.point.gu || ""), "ko") ||
        String(a.type || "").localeCompare(String(b.type || ""), "ko") ||
        String((a.tenant && a.tenant.tenant) || (a.transaction && a.transaction.building) || "").localeCompare(String((b.tenant && b.tenant.tenant) || (b.transaction && b.transaction.building) || ""), "ko")
      );
      caseListCount.textContent = `임대 ${fmt.format(leaseRows.length)} · 매매 ${fmt.format(transactionRows.length)}`;
      caseListPanel.classList.toggle("is-empty", currentCaseRows.length === 0);
      setCaseListOpen(false);
      if (!currentCaseRows.length) {
        caseRows.innerHTML = `<div class="caseEmpty">이 분기에 연결된 임대/매매 사례가 없습니다.</div>`;
        return;
      }
      caseRows.innerHTML = currentCaseRows.map((row, index) => {
        if (row.type === "transaction") {
          const tx = row.transaction;
          return `
            <button class="caseItem isTransaction" data-index="${index}">
              <b>${escapeHtml(tx.building || "매매사례")}</b>
              <span>매매사례 · ${escapeHtml(tx.region || "기타")} · ${escapeHtml(tx.gu)} ${escapeHtml(tx.dong || "")}</span>
              <span class="caseCondition">거래가 ${krwBillionText(tx.dealPriceThousandKrw)} · 평당가 ${thousandKrwText(tx.pricePerPyeongThousandKrw)}</span>
            </button>
          `;
        }
        const point = row.point;
        const tenant = row.tenant;
        const noc = tenant.conditionNoc || point.noc;
        const rent = tenant.conditionRent || point.rent;
        return `
          <button class="caseItem" data-index="${index}">
            <b>${escapeHtml(tenant.tenant || "임차인 미상")}</b>
            <span>${escapeHtml(point.building)} · ${escapeHtml(point.region || "기타")} · ${escapeHtml(point.gu)}</span>
            <span class="caseCondition">NOC ${moneyText(noc, "원/평")} · 월임대료 ${moneyText(rent, "원/평")}</span>
          </button>
        `;
      }).join("");
      highlightMatchingCase(selectedPoint);
    }

    function highlightCaseItem(index) {
      caseRows.querySelectorAll(".caseItem").forEach((button, i) => {
        button.classList.toggle("is-active", i === index);
        if (i === index) button.scrollIntoView({ block: "nearest" });
      });
    }

    function highlightMatchingCase(point) {
      if (!point) {
        highlightCaseItem(-1);
        return;
      }
      const index = currentCaseRows.findIndex(row => {
        if (point.isTransaction) {
          return row.type === "transaction" && row.transaction.transactionCaseId === point.transaction.transactionCaseId;
        }
        return row.point.assetId === point.assetId;
      });
      highlightCaseItem(index);
    }

    function renderDetail(point) {
      if (!point) {
        const count = currentPoints.length;
        detailPanel.className = "side is-empty";
        detailPanel.innerHTML = `
          <div class="inspectorHeader">
            <div class="inspectorEyebrow">선택 없음</div>
            <div class="inspectorTitle">건물 막대를 클릭하세요</div>
            <div class="inspectorSub">${currentPeriod || ""} · 관측 건물 ${fmt.format(count)}개</div>
          </div>
          <div class="inspectorBody">
            <div class="metricRow"><span>Z값</span><strong>NOC</strong></div>
            <div class="metricRow"><span>보간</span><strong>IDW / 실측막대 병행</strong></div>
          </div>
        `;
        return;
      }
      if (point.isTransaction) {
        const tx = point.transaction || {};
        const capValue = tx.stabilizedNominalCapOperation ?? tx.stabilizedNominalCap ?? tx.stabilizedRealCapOperation ?? tx.stabilizedRealCap ?? tx.asisNominalCapOperation ?? tx.asisRealCapOperation ?? tx.imCap;
        const seller = [tx.sellerName, tx.sellerType].filter(Boolean).join(" · ");
        const buyer = [tx.buyerName, tx.buyerType, tx.buyerDetail].filter(Boolean).join(" · ");
        const overview = getBuildingOverview(point);
        const overviewHtml = overview ? `
          <div class="sectionTitle">건축물대장 일반개요</div>
          <div class="overviewGrid">
            <div class="metricRow"><span>대장 상태</span><strong>${escapeHtml(buildingStatusText(overview.status))}</strong></div>
            <div class="metricRow"><span>대지위치</span><strong>${escapeHtml(overview.platPlace || "-")}</strong></div>
            <div class="metricRow"><span>주용도</span><strong>${escapeHtml(overview.mainUse || "-")}</strong></div>
            <div class="metricRow"><span>구조</span><strong>${escapeHtml(overview.mainStructure || "-")}</strong></div>
            <div class="metricRow"><span>사용승인일</span><strong>${escapeHtml(overview.approvalDate || "-")}</strong></div>
            <div class="metricRow"><span>연면적</span><strong>${sqmText(overview.totalFloorAreaSqm)}</strong></div>
            <div class="metricRow"><span>층수</span><strong>지상 ${countText(overview.groundFloorCount)} / 지하 ${countText(overview.basementFloorCount)}</strong></div>
          </div>
        ` : `
          <div class="sectionTitle">건축물대장 일반개요</div>
          <div class="emptyCase">이 매매사례 PNU에 연결된 건축물대장 일반개요가 아직 없습니다.</div>
        `;
        detailPanel.className = "side is-selected";
        detailPanel.innerHTML = `
          <div class="inspectorHeader">
            <div class="inspectorEyebrow">매매사례 · ${escapeHtml(tx.period || currentPeriod)}</div>
            <div class="inspectorTitle">${escapeHtml(tx.building || "매매사례")}</div>
            <div class="inspectorSub">${escapeHtml(tx.region || "기타")} · ${escapeHtml(tx.gu)} ${escapeHtml(tx.dong || "")} · ${escapeHtml(tx.closingDate || tx.contractDate || "-")}</div>
          </div>
          <div class="inspectorBody">
            <div class="statGrid">
              <div class="stat"><span>거래가</span><strong>${krwBillionText(tx.dealPriceThousandKrw)}</strong></div>
              <div class="stat"><span>평당가</span><strong>${thousandKrwText(tx.pricePerPyeongThousandKrw)}</strong></div>
              <div class="stat"><span>연면적</span><strong>${sqmText(tx.grossFloorAreaSqm)}</strong></div>
              <div class="stat"><span>거래면적</span><strong>${sqmText(tx.transactedAreaSqm)}</strong></div>
              <div class="stat"><span>Cap</span><strong>${percentText(capValue)}</strong></div>
              <div class="stat"><span>NOI</span><strong>${thousandKrwText(tx.noi, "천원")}</strong></div>
            </div>
            <div class="sectionTitle">거래 정보</div>
            <div class="overviewGrid">
              <div class="metricRow"><span>계약일</span><strong>${escapeHtml(tx.contractDate || "-")}</strong></div>
              <div class="metricRow"><span>잔금일</span><strong>${escapeHtml(tx.closingDate || "-")}</strong></div>
              <div class="metricRow"><span>매도인</span><strong>${escapeHtml(seller || "-")}</strong></div>
              <div class="metricRow"><span>매수인</span><strong>${escapeHtml(buyer || "-")}</strong></div>
              <div class="metricRow"><span>매입 목적</span><strong>${escapeHtml(tx.acquisitionPurpose || "-")}</strong></div>
              <div class="metricRow"><span>Vehicle</span><strong>${escapeHtml(tx.investmentVehicle || tx.investmentVehicleDetail || "-")}</strong></div>
              <div class="metricRow"><span>거래 유형</span><strong>${escapeHtml(tx.transactionType || "-")}</strong></div>
              <div class="metricRow"><span>주소</span><strong>${escapeHtml(tx.legalAddress || tx.address || "-")}</strong></div>
              <div class="metricRow"><span>PNU</span><strong>${escapeHtml(tx.pnu || "-")}</strong></div>
            </div>
            ${overviewHtml}
          </div>
        `;
        return;
      }
      detailPanel.className = "side is-selected";
      const overview = getBuildingOverview(point);
      const overviewHtml = overview ? `
        <div class="sectionTitle">건축물대장 일반개요</div>
        <div class="overviewGrid">
          <div class="metricRow"><span>대장 상태</span><strong>${escapeHtml(buildingStatusText(overview.status))}</strong></div>
          <div class="metricRow"><span>대지위치</span><strong>${escapeHtml(overview.platPlace || "-")}</strong></div>
          <div class="metricRow"><span>대장 건물명</span><strong>${escapeHtml(overview.buildingNameRegister || "-")}</strong></div>
          <div class="metricRow"><span>주용도</span><strong>${escapeHtml(overview.mainUse || "-")}</strong></div>
          <div class="metricRow"><span>구조</span><strong>${escapeHtml(overview.mainStructure || "-")}</strong></div>
          <div class="metricRow"><span>사용승인일</span><strong>${escapeHtml(overview.approvalDate || "-")}</strong></div>
          <div class="metricRow"><span>연면적</span><strong>${sqmText(overview.totalFloorAreaSqm)}</strong></div>
          <div class="metricRow"><span>건축면적</span><strong>${sqmText(overview.buildingAreaSqm)}</strong></div>
          <div class="metricRow"><span>대지면적</span><strong>${sqmText(overview.siteAreaSqm)}</strong></div>
          <div class="metricRow"><span>층수</span><strong>지상 ${countText(overview.groundFloorCount)} / 지하 ${countText(overview.basementFloorCount)}</strong></div>
          <div class="metricRow"><span>높이</span><strong>${meterText(overview.heightM)}</strong></div>
          <div class="metricRow"><span>주차</span><strong>옥내 ${countText(overview.parkingIndoorCount)} / 옥외 ${countText(overview.parkingOutdoorCount)}</strong></div>
        </div>
        <div class="sourceNote">출처: VWorld 좌표/PNU, 건축물대장 HUB 표제부 API</div>
      ` : `
        <div class="sectionTitle">건축물대장 일반개요</div>
        <div class="emptyCase">이 PNU에 연결된 건축물대장 일반개요가 아직 없습니다.</div>
      `;
      const tenants = point.tenants || [];
      const tenantHtml = tenants.length
        ? tenants.map(t => `
          <div class="caseCard">
            <strong>${escapeHtml(t.tenant)}</strong>
            <div class="caseMeta">${escapeHtml(t.demand || "임대사례")} · ${escapeHtml(t.industrySmall || t.industry || "-")}</div>
            <div class="metricRow"><span>입주 위치</span><strong>${escapeHtml(point.building)} · ${escapeHtml(t.toAddress || point.gu + " " + point.dong)}</strong></div>
            <div class="metricRow"><span>이전 위치</span><strong>${escapeHtml(t.fromBuilding || t.fromAddress || "-")}</strong></div>
            <div class="metricRow"><span>전용면적</span><strong>${areaText(t.exclusiveArea)}${t.areaChange !== null ? " · 증감 " + fmt1.format(t.areaChange) + "㎡" : ""}</strong></div>
            <div class="caseTerms">
              <div class="term"><span>NOC</span><b>${moneyText(t.conditionNoc, "원/평")}</b></div>
              <div class="term"><span>보증금</span><b>${moneyText(t.conditionDeposit, "원/평")}</b></div>
              <div class="term"><span>월임대료</span><b>${moneyText(t.conditionRent, "원/평")}</b></div>
              <div class="term"><span>관리비</span><b>${moneyText(t.conditionMaintenance, "원/평")}</b></div>
              <div class="term"><span>렌트프리</span><b>${monthText(t.conditionRentFree)}</b></div>
              <div class="term"><span>공실률</span><b>${percentText(t.conditionVacancyRate)}</b></div>
            </div>
            <div class="metricRow"><span>DART</span><strong>${escapeHtml(t.corpName || "미매칭")} ${t.stockCode ? "(" + escapeHtml(t.stockCode) + ")" : ""}</strong></div>
            <div class="metricRow"><span>조건 연결</span><strong>${escapeHtml(conditionStatusText(t.conditionStatus))}</strong></div>
          </div>
        `).join("")
        : `<div class="emptyCase">이 분기 이 건물에 연결된 실제 임대사례는 아직 없습니다. 위 임대료 수준은 관측 임대료/NOC 기준입니다.</div>`;
      detailPanel.innerHTML = `
        <div class="inspectorHeader">
          <div class="inspectorEyebrow">임대료 수준 · ${escapeHtml(currentPeriod)}</div>
          <div class="inspectorTitle">${escapeHtml(point.building)}</div>
          <div class="inspectorSub">${escapeHtml(point.region || "기타")} · ${escapeHtml(point.gu)} ${escapeHtml(point.dong)} · 임대사례 ${fmt.format(point.tenantCount || 0)}건</div>
        </div>
        <div class="inspectorBody">
          <div class="statGrid">
            <div class="stat"><span>NOC</span><strong>${moneyText(point.noc, "원/평")}</strong></div>
            <div class="stat"><span>월임대료</span><strong>${moneyText(point.rent, "원/평")}</strong></div>
            <div class="stat"><span>관리비</span><strong>${moneyText(point.maintenance, "원/평")}</strong></div>
            <div class="stat"><span>보증금</span><strong>${moneyText(point.deposit, "원/평")}</strong></div>
            <div class="stat"><span>렌트프리</span><strong>${monthText(point.rentFree)}</strong></div>
            <div class="stat"><span>공실률</span><strong>${percentText(point.vacancyRate)}</strong></div>
          </div>
          ${overviewHtml}
          <div class="sectionTitle">실제 임대사례</div>
          ${tenantHtml}
        </div>
      `;
    }

    function moneyText(value, suffix) {
      if (value === null || value === undefined || value === "") return "-";
      const n = Number(value);
      return Number.isFinite(n) ? `${fmt.format(n)} ${suffix}` : "-";
    }

    function krwBillionText(valueThousand) {
      if (valueThousand === null || valueThousand === undefined || valueThousand === "") return "-";
      const n = Number(valueThousand);
      return Number.isFinite(n) ? `${fmt1.format(n / 100000)} 억원` : "-";
    }

    function thousandKrwText(value, suffix = "천원/평") {
      if (value === null || value === undefined || value === "") return "-";
      const n = Number(value);
      return Number.isFinite(n) ? `${fmt.format(n)} ${suffix}` : "-";
    }

    function monthText(value) {
      if (value === null || value === undefined || value === "") return "-";
      const n = Number(value);
      return Number.isFinite(n) ? `${fmt1.format(n)} 개월/년` : "-";
    }

    function areaText(value) {
      if (value === null || value === undefined || value === "") return "-";
      const n = Number(value);
      return Number.isFinite(n) ? `${fmt1.format(n)}㎡` : "-";
    }

    function sqmText(value) {
      if (value === null || value === undefined || value === "") return "-";
      const n = Number(value);
      return Number.isFinite(n) ? `${fmt.format(n)}㎡` : "-";
    }

    function meterText(value) {
      if (value === null || value === undefined || value === "") return "-";
      const n = Number(value);
      return Number.isFinite(n) ? `${fmt1.format(n)}m` : "-";
    }

    function countText(value) {
      if (value === null || value === undefined || value === "") return "-";
      const n = Number(value);
      return Number.isFinite(n) ? fmt.format(n) : "-";
    }

    function percentText(value) {
      if (value === null || value === undefined || value === "") return "-";
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      return `${fmt1.format(Math.abs(n) <= 1 ? n * 100 : n)}%`;
    }

    function coordText(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n.toFixed(5) : "-";
    }

    function conditionStatusText(value) {
      const map = {
        rent_condition_found: "임대조건 연결",
        matched: "임대조건 연결",
        no_asset_match: "자산 미매칭",
        no_period_in_rent_fact: "동일 분기 임대료 없음",
        no_rent_condition: "조건 없음",
      };
      return map[value] || value || "-";
    }

    function buildingStatusText(value) {
      const map = {
        found: "조회 성공",
        not_found: "대장 미발견",
        error: "조회 오류",
        pending: "대기",
      };
      return map[value] || value || "-";
    }

    function runSearch() {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) {
        results.innerHTML = "";
        return;
      }
      const matches = [];
      const pointRows = currentPoints.map(p => ({ type: "point", period: currentPeriod, point: p, text: [p.building, p.region, p.gu, p.dong, ...(p.tenants || []).flatMap(t => [t.tenant, t.corpName, t.stockCode])].join(" ").toLowerCase() }));
      const tenantRows = data.tenantCases.map(t => ({ type: "tenant", period: t.period, tenant: t, text: [t.tenant, t.corpName, t.stockCode, t.building, t.gu, t.dong, t.industry].join(" ").toLowerCase() }));
      const transactionRows = (data.transactionCases || []).map(t => ({ type: "transaction", period: t.period, transaction: t, text: [t.building, t.region, t.gu, t.dong, t.legalAddress, t.address, t.sellerName, t.buyerName, t.buyerDetail, t.acquisitionPurpose, t.investmentVehicle, t.investmentVehicleDetail].join(" ").toLowerCase() }));
      for (const row of [...pointRows, ...tenantRows, ...transactionRows]) {
        if (row.text.includes(q)) matches.push(row);
        if (matches.length >= 9) break;
      }
      results.innerHTML = matches.map((m, idx) => {
        if (m.type === "point") {
          const p = m.point;
          return `<button class="result" data-kind="point" data-index="${idx}"><b>${escapeHtml(p.building)}</b><br>${escapeHtml(m.period)} · NOC ${fmt.format(p.noc)} · ${escapeHtml(p.gu)}</button>`;
        }
        if (m.type === "transaction") {
          const t = m.transaction;
          return `<button class="result" data-kind="transaction" data-index="${idx}"><b>${escapeHtml(t.building || "매매사례")}</b><br>${escapeHtml(t.period)} · 매매 ${krwBillionText(t.dealPriceThousandKrw)} · ${escapeHtml(t.gu)}</button>`;
        }
        const t = m.tenant;
        return `<button class="result" data-kind="tenant" data-index="${idx}"><b>${escapeHtml(t.tenant)}</b><br>${escapeHtml(t.period)} · ${escapeHtml(t.building)} · ${escapeHtml(t.corpName || "DART 미매칭")}</button>`;
      }).join("");
      [...results.querySelectorAll(".result")].forEach((btn) => {
        const m = matches[Number(btn.dataset.index)];
        btn.addEventListener("click", () => {
          if (m.period !== currentPeriod) setPeriod(m.period);
          setTimeout(() => {
            if (m.type === "point") selectPoint(m.point, { zoom: true });
            else if (m.type === "transaction") selectPoint(transactionPoint(m.transaction), { zoom: true });
            else {
              const p = (data.pointsByPeriod[m.period] || []).find(row => row.assetId === m.tenant.assetId)
                || { ...m.tenant, noc: data.meta.valueDomain.p03, tenants: [m.tenant], region: "", gu: m.tenant.gu, dong: m.tenant.dong };
              selectPoint(p, { zoom: true });
            }
          }, 0);
        });
      });
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    function refreshFocusMapForCamera() {
      if (!reviewMode || !selectedPoint) return;
      const now = Date.now();
      if (now - lastFocusMapCheckAt < 650) return;
      lastFocusMapCheckAt = now;
      updateFocusMap(selectedPoint);
    }

    function updateLabelScale(force = false) {
      if (!labelGroup || !camera || !controls) return;
      const distance = camera.position.distanceTo(controls.target);
      for (const sprite of labelGroup.children) {
        const kind = sprite.userData.labelKind || "label";
        const canvasWidth = sprite.userData.canvasWidth || 1;
        const canvasHeight = sprite.userData.canvasHeight || 1;
        const baseScale = sprite.userData.baseScale || 1;
        const baseX = sprite.userData.baseX ?? sprite.position.x;
        const baseY = sprite.userData.baseY ?? sprite.position.y;
        const baseZ = sprite.userData.baseZ ?? sprite.position.z;
        if (reviewMode) {
          const distanceFromSelection = selectedPoint
            ? Math.hypot(baseX - sx(selectedPoint.x), baseZ - sz(selectedPoint.y))
            : 0;
          const visibleRadius = kind === "region" ? 190 : 130;
          sprite.visible = kind !== "compass" && distanceFromSelection <= visibleRadius;
          const groundOffset = kind === "region" ? 4.8 : (kind === "gu" ? 3.2 : 2.4);
          sprite.position.y = columnGroundY + groundOffset;
        } else {
          sprite.visible = true;
          sprite.position.y = baseY;
        }
        const maxFactor = kind === "region" ? 1.0 : 0.86;
        const minFactor = kind === "compass" ? 0.18 : (kind === "region" ? 0.055 : 0.04);
        const factor = THREE.MathUtils.clamp(distance / 1800, minFactor, maxFactor);
        if (!force && Math.abs((sprite.userData.lastLabelFactor || 0) - factor) < 0.006) continue;
        sprite.userData.lastLabelFactor = factor;
        sprite.scale.set(canvasWidth * baseScale * factor, canvasHeight * baseScale * factor, 1);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateColumnScale();
      refreshFocusMapForCamera();
      updateLabelScale();
      updateSelectionClearButton();
      renderer.render(scene, camera);
    }

    boot().catch(err => {
      console.error(err);
      loading.textContent = "Failed to load NOC surface";
    });
  </script>
</body>
</html>
